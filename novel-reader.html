<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>縦書きリーダー｜北風小僧</title>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-outer: #222222;
      --paper-bg: #f8f4e6;
      --text-color: #2b2b2b;
      --ui-bg: rgba(255, 255, 255, 0.92);
      --ui-text: #111111;
    }

    body.theme-dark {
      --bg-outer: #0a0a0a;
      --paper-bg: #1c1c1c;
      --text-color: #cccccc;
      --ui-bg: rgba(30, 30, 30, 0.92);
      --ui-text: #ffffff;
    }

    body {
      font-family: 'Shippori Mincho', "Yu Mincho", "MS PMincho", serif;
      background-color: var(--bg-outer);
      color: var(--text-color);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      user-select: none;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 上部操作UI */
    .top-navbar {
      position: fixed; top: 0; left: 0; width: 100%; z-index: 2000;
      background: var(--ui-bg); border-bottom: 1px solid rgba(0,0,0,0.1);
      padding: 12px 16px;
      display: flex; justify-content: space-between; align-items: center;
      backdrop-filter: blur(8px);
      transform: translateY(-100%); transition: transform 0.25s ease;
      color: var(--ui-text);
    }
    .top-navbar.active { transform: translateY(0); }

    .nav-left, .nav-right { display: flex; align-items: center; gap: 10px; }
    
    .btn-ui {
      background: rgba(0,0,0,0.05); border: 1px solid rgba(0,0,0,0.15);
      border-radius: 6px; padding: 6px 12px; font-size: 0.85rem; font-weight: bold;
      color: var(--ui-text); cursor: pointer; font-family: inherit;
      display: flex; align-items: center; justify-content: center;
    }
    body.theme-dark .btn-ui { background: rgba(255, 255, 255, 0.1); border-color: rgba(255,255,255,0.2); }

    /* 文庫本用紙コンテナ */
    .book-paper {
      width: 92vw;
      height: calc(92vw * 1.414);
      max-height: 90vh;
      max-width: calc(90vh / 1.414);
      background-color: var(--paper-bg);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      position: relative;
      overflow: hidden;
      border-radius: 2px;
      transition: background-color 0.3s;
    }

    /* ページ上部の柱（作品名 & ページ数） */
    .page-header-柱 {
      position: absolute; top: 15px; left: 35px; right: 35px;
      display: flex; justify-content: space-between; align-items: center;
      font-size: 0.72rem; opacity: 0.6; pointer-events: none;
      writing-mode: horizontal-tb;
      border-bottom: 1px solid rgba(0,0,0,0.08);
      padding-bottom: 4px;
    }
    body.theme-dark .page-header-柱 { border-bottom-color: rgba(255,255,255,0.1); }

    /* 縦書きページ送りコンテナ */
    .page-viewport {
      width: 100%; height: 100%;
      padding: 50px 30px 30px;
      writing-mode: vertical-rl;
      -webkit-writing-mode: vertical-rl;
      text-orientation: upright;
      font-size: 1.05rem;
      line-height: 2.1;
      letter-spacing: 0.08em;
      column-width: calc(100% - 60px);
      column-gap: 60px;
      column-fill: auto;
    }

    /* 1ページ目：扉デザイン */
    .sketch-tobira-page {
      width: 100%; height: 100%;
      padding: 10px;
      margin-left: 30px;
      display: flex; justify-content: center; align-items: center;
    }
    .tobira-border-box {
      width: 100%; height: 100%;
      border: 1px solid var(--text-color);
      padding: 30px 15px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: space-between;
      text-align: center;
    }
    .tobira-genre { font-size: 0.9rem; letter-spacing: 0.1em; }
    .tobira-title { font-size: 1.8rem; font-weight: bold; margin: 15px 0; }
    .tobira-meta-group { display: flex; flex-direction: column; gap: 4px; }
    .tobira-date { font-size: 0.85rem; }
    .tobira-count { font-size: 0.85rem; border-bottom: 1px solid var(--text-color); padding-bottom: 2px; }
    .tobira-author { font-size: 1.05rem; font-weight: bold; border-bottom: 1px solid var(--text-color); padding-bottom: 2px; margin-top: auto; }

    /* 本文表示 */
    .novel-text p {
      text-indent: 1em; margin-left: 1.1em; word-break: break-all;
    }

    /* 下部操作UI */
    .bottom-navbar {
      position: fixed; bottom: 0; left: 0; width: 100%; z-index: 2000;
      background: var(--ui-bg); border-top: 1px solid rgba(0,0,0,0.1);
      padding: 15px 24px 20px;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      backdrop-filter: blur(8px);
      transform: translateY(100%); transition: transform 0.25s ease;
      color: var(--ui-text);
    }
    .bottom-navbar.active { transform: translateY(0); }

    /* 吹き出し風ページ表示 */
    .page-bubble {
      background: #111; color: #fff; font-size: 0.78rem; padding: 4px 10px;
      border-radius: 12px; position: relative; font-weight: bold;
    }
    .page-bubble::after {
      content: ''; position: absolute; bottom: -5px; left: 50%; transform: translateX(-50%);
      border-width: 5px 5px 0; border-style: solid; border-color: #111 transparent;
    }

    .slider-input {
      width: 100%; max-width: 320px; accent-color: #111; cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- 上部操作UI -->
  <div class="top-navbar" id="top-nav">
    <div class="nav-left">
      <button class="btn-ui" onclick="javascript:history.back()">＜ 戻る</button>
    </div>
    <div class="nav-right">
      <button class="btn-ui" onclick="changeFontSize(0.08)">A↑</button>
      <button class="btn-ui" onclick="changeFontSize(-0.08)">A↓</button>
      <button class="btn-ui" onclick="toggleTheme()">🌙</button>
      <button class="btn-ui" onclick="toggleBookmark()">しおり <span id="bm-mark"></span></button>
    </div>
  </div>

  <!-- 文庫本用紙本体 -->
  <div class="book-paper" onclick="handlePaperClick(event)">
    
    <!-- 本のページ上部：タイトル ＆ ページ数 -->
    <div class="page-header-柱">
      <span id="header-title">作品名</span>
      <span id="header-page">1ページ</span>
    </div>

    <!-- 縦書きビューポート -->
    <div class="page-viewport" id="viewport">
      
      <!-- 1ページ目：手書きスケッチ再現 扉 -->
      <div class="sketch-tobira-page">
        <div class="tobira-border-box">
          <div class="tobira-genre" id="tobira-genre-text">ー小説ー</div>
          <div class="tobira-title" id="tobira-title-text">佳人</div>
          <div class="tobira-meta-group">
            <div class="tobira-date" id="tobira-date-text">2026.08.21</div>
            <div class="tobira-count" id="tobira-count-text">0文字</div>
          </div>
          <div class="tobira-author">北風小僧</div>
        </div>
      </div>

      <!-- 本文（txtから自動流し込み） -->
      <div class="novel-text" id="novel-text"></div>

    </div>
  </div>

  <!-- 下部操作UI -->
  <div class="bottom-navbar" id="bottom-nav">
    <div class="page-bubble" id="page-bubble-text">1 / 1 ページ</div>
    <input type="range" class="slider-input" id="page-slider" min="1" max="1" value="1" oninput="onSliderChange(this.value)">
  </div>

  <script src="data.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const articleId = params.get('id') || 'kajin';
    const currentArticle = allArticles.find(item => item.id === articleId);

    const viewport = document.getElementById('viewport');
    const novelText = document.getElementById('novel-text');

    if (currentArticle) {
      document.title = `${currentArticle.title}｜北風小僧`;
      document.getElementById('header-title').innerText = currentArticle.title;
      document.getElementById('tobira-title-text').innerText = currentArticle.title;
      document.getElementById('tobira-date-text').innerText = currentArticle.date;

      const genreMap = { "red": "ー小説ー", "blue": "ー評論風ー", "green": "ー随筆ー" };
      if (genreMap[currentArticle.genre]) {
        document.getElementById('tobira-genre-text').innerText = genreMap[currentArticle.genre];
      }

      if (currentArticle.file) {
        fetch(currentArticle.file)
          .then(res => res.text())
          .then(text => {
            novelText.innerHTML = '';
            
            // 本文のみの文字数を自動計測
            const cleanText = text.replace(/\s+/g, '');
            document.getElementById('tobira-count-text').innerText = `${cleanText.length.toLocaleString()}文字`;

            text.split(/\r?\n/).forEach(line => {
              if (line.trim() !== '') {
                const p = document.createElement('p');
                p.textContent = line;
                novelText.appendChild(p);
              }
            });

            recalcPages();
          });
      }
    }

    let totalPages = 1;
    let currentPage = 1;

    function recalcPages() {
      setTimeout(() => {
        const scrollW = viewport.scrollWidth;
        const clientW = viewport.clientWidth;
        totalPages = Math.max(1, Math.round(scrollW / clientW));
        
        const slider = document.getElementById('page-slider');
        slider.max = totalPages;
        updateDisplay();
      }, 250);
    }

    function updateDisplay() {
      document.getElementById('header-page').innerText = `${currentPage}ページ`;
      document.getElementById('page-bubble-text').innerText = `${currentPage} / ${totalPages} ページ`;
      document.getElementById('page-slider').value = currentPage;
    }

    // タップ操作判定（本と同じ：左タップで次ページ、右タップで前ページ）
    function handlePaperClick(e) {
      const rect = e.currentTarget.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const width = rect.width;

      // 中央タップでUI開閉
      if (clickX > width * 0.35 && clickX < width * 0.65) {
        document.getElementById('top-nav').classList.toggle('active');
        document.getElementById('bottom-nav').classList.toggle('active');
        return;
      }

      // 左側タップで次のページへ進む（スクロールは左方向へ）
      if (clickX <= width * 0.35) {
        if (currentPage < totalPages) currentPage++;
      } 
      // 右側タップで前のページへ戻る
      else if (clickX >= width * 0.65) {
        if (currentPage > 1) currentPage--;
      }

      viewport.scrollLeft = -((currentPage - 1) * viewport.clientWidth);
      updateDisplay();
    }

    function onSliderChange(val) {
      currentPage = parseInt(val);
      viewport.scrollLeft = -((currentPage - 1) * viewport.clientWidth);
      updateDisplay();
    }

    let currentFontSize = 1.05;
    function changeFontSize(delta) {
      currentFontSize = Math.max(0.8, Math.min(1.4, currentFontSize + delta));
      viewport.style.fontSize = `${currentFontSize}rem`;
      recalcPages();
    }

    function toggleTheme() {
      document.body.classList.toggle('theme-dark');
    }

    function toggleBookmark() {
      const saved = localStorage.getItem(`bm_${articleId}`);
      if (saved == currentPage) {
        localStorage.removeItem(`bm_${articleId}`);
        document.getElementById('bm-mark').innerText = '';
        alert('しおりを外しました');
      } else {
        localStorage.setItem(`bm_${articleId}`, currentPage);
        document.getElementById('bm-mark').innerText = '🔖';
        alert(`${currentPage}ページにしおりを挟みました`);
      }
    }
  </script>
</body>
</html>
