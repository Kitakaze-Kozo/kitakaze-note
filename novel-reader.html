<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>佳人｜北風小僧</title>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-outer: #333333;
      --paper-bg: #f8f4e6;
      --text-color: #2b2b2b;
      --ui-bg: rgba(255, 255, 255, 0.95);
      --ui-text: #111111;
    }

    body.theme-white {
      --paper-bg: #ffffff;
      --text-color: #111111;
    }

    body {
      font-family: 'Shippori Mincho', "Yu Mincho", "MS PMincho", serif;
      background-color: var(--bg-outer);
      color: var(--text-color);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      user-select: none;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* 上部操作UI（等間隔配置） */
    .top-navbar {
      position: fixed; top: 0; left: 0; width: 100%; z-index: 2000;
      background: var(--ui-bg); border-bottom: 1px solid rgba(0,0,0,0.1);
      padding: 10px 12px;
      display: flex; justify-content: space-between; align-items: center;
      backdrop-filter: blur(8px);
      transform: translateY(-100%); transition: transform 0.25s ease;
      color: var(--ui-text);
    }
    .top-navbar.active { transform: translateY(0); }

    .nav-container {
      width: 100%;
      display: flex; justify-content: space-between; align-items: center; gap: 6px;
    }

    .btn-ui {
      flex: 1;
      background: rgba(0,0,0,0.05); border: 1px solid rgba(0,0,0,0.15);
      border-radius: 6px; padding: 8px 4px; font-size: 0.8rem; font-weight: bold;
      color: var(--ui-text); cursor: pointer; font-family: inherit;
      white-space: nowrap; text-align: center;
    }

    /* 文庫本用紙コンテナ */
    .book-paper {
      width: 92vw;
      height: calc(92vw * 1.414);
      max-height: 90vh;
      max-width: calc(90vh / 1.414);
      background-color: var(--paper-bg);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      position: relative;
      overflow: hidden;
      border-radius: 2px;
      transition: background-color 0.3s;
    }

    /* ページ上部の柱 */
    .page-header-柱 {
      position: absolute; top: 15px; left: 35px; right: 35px;
      display: flex; justify-content: space-between; align-items: center;
      font-size: 0.72rem; opacity: 0.65; pointer-events: none;
      writing-mode: horizontal-tb;
      border-bottom: 1px solid rgba(0,0,0,0.08);
      padding-bottom: 4px;
      z-index: 10;
      transition: opacity 0.2s;
    }
    .page-header-柱.hide { opacity: 0; }

    /* ビューポート */
    .page-viewport-container {
      width: 100%; height: 100%;
      display: flex;
      flex-direction: row-reverse;
      transition: transform 0.3s ease-out;
    }

    .page-sheet {
      min-width: 100%; height: 100%;
      padding: 35px 25px 25px;
      flex-shrink: 0;
      overflow: hidden;
    }

    /* 扉ページ */
    .sketch-tobira-page {
      width: 100%; height: 100%;
      display: flex; justify-content: center; align-items: center;
      writing-mode: horizontal-tb !important;
    }
    .tobira-border-box {
      width: 82%; height: 78%;
      border: 1px solid var(--text-color);
      padding: 25px 15px 20px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: space-between;
      text-align: center;
      writing-mode: horizontal-tb !important;
    }
    .tobira-genre { font-size: 0.85rem; letter-spacing: 0.15em; }
    
    /* タイトル（佳人）の位置をほんの少し下げ */
    .tobira-title { font-size: 1.7rem; font-weight: bold; margin-top: 22px; margin-bottom: 8px; letter-spacing: 0.1em; }
    
    .tobira-meta-group { display: flex; flex-direction: column; gap: 4px; align-items: center; }
    .tobira-date { font-size: 0.8rem; }
    .tobira-count { font-size: 0.8rem; }
    
    /* 北風小僧の位置を少し上げる */
    .tobira-author { 
      font-size: 1rem; 
      font-weight: bold; 
      border-bottom: 1px solid var(--text-color); 
      padding-bottom: 2px; 
      margin-top: auto; 
      margin-bottom: 25px; /* 下部余白を増やして位置を上に調整 */
    }

    /* 本文ページ */
    .body-text-page {
      padding: 50px 30px 30px;
      height: 100%; width: 100%;
      writing-mode: vertical-rl;
      -webkit-writing-mode: vertical-rl;
      text-orientation: upright;
      font-size: 1.05rem;
      line-height: 1.7;          /* 文章間隔を狭く設定 */
      letter-spacing: 0.04em;
      column-width: calc(100% - 60px);
      column-gap: 60px;
      column-fill: auto;
      overflow: hidden;
    }
    .body-text-page p {
      text-indent: 1em; margin-left: 0.6em; word-break: break-all;
    }

    /* 下部操作UI */
    .bottom-navbar {
      position: fixed; bottom: 0; left: 0; width: 100%; z-index: 2000;
      background: var(--ui-bg); border-top: 1px solid rgba(0,0,0,0.1);
      padding: 15px 24px 20px;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      backdrop-filter: blur(8px);
      transform: translateY(100%); transition: transform 0.25s ease;
      color: var(--ui-text);
    }
    .bottom-navbar.active { transform: translateY(0); }

    .page-bubble {
      background: #111; color: #fff; font-size: 0.78rem; padding: 4px 10px;
      border-radius: 12px; position: relative; font-weight: bold;
    }
    .page-bubble::after {
      content: ''; position: absolute; bottom: -5px; left: 50%; transform: translateX(-50%);
      border-width: 5px 5px 0; border-style: solid; border-color: #111 transparent;
    }

    .slider-input {
      width: 100%; max-width: 320px; accent-color: #111; cursor: pointer;
      direction: rtl;
    }
  </style>
</head>
<body>

  <!-- 上部操作UI -->
  <div class="top-navbar" id="top-nav">
    <div class="nav-container">
      <button class="btn-ui" onclick="javascript:history.back()">＜ 戻る</button>
      <button class="btn-ui" onclick="changeFontSize(0.08)">A ↑</button>
      <button class="btn-ui" onclick="changeFontSize(-0.08)">A ↓</button>
      <button class="btn-ui" onclick="toggleTheme()" id="theme-btn">紙色：生成り</button>
      <button class="btn-ui" onclick="toggleBookmark()" id="bm-btn">しおり</button>
    </div>
  </div>

  <!-- 文庫本用紙本体 -->
  <div class="book-paper" id="book-paper-el">
    
    <!-- ページ上部の柱 -->
    <div class="page-header-柱 hide" id="page-header">
      <span id="header-title">佳人</span>
      <span id="header-page">1ページ</span>
    </div>

    <!-- ビューポート -->
    <div class="page-viewport-container" id="viewport-container">
      
      <!-- 扉ページ（1ページ目） -->
      <div class="page-sheet">
        <div class="sketch-tobira-page">
          <div class="tobira-border-box">
            <div class="tobira-genre" id="tobira-genre-text">ー小説ー</div>
            <div class="tobira-title" id="tobira-title-text">佳人</div>
            <div class="tobira-meta-group">
              <div class="tobira-date" id="tobira-date-text">2026.08.21</div>
              <div class="tobira-count" id="tobira-count-text">0文字</div>
            </div>
            <div class="tobira-author">北風小僧</div>
          </div>
        </div>
      </div>

      <!-- 本文ページ（★ここに直接文章を書いてください★） -->
      <div class="page-sheet body-text-page" id="novel-text">
        <p>ここに本文の第一段落を記述します。文字サイズや行間は自動で最適な縦書きレイアウトに調整されます。</p>
        <p>ここに第二段落を記述します。文章が長くなると自動的に次のページへ送られ、文字サイズを変更（A↑/A↓）するとページ数が連動して動的に再計算されます。</p>
        <p>画面の中央をタップすると上部の「＜戻る」ボタンや操作メニューが表示され、左側をタップすると次のページへ進み、右側をタップすると前のページ（扉ページ）へ戻ります。</p>
      </div>

    </div>
  </div>

  <!-- 下部操作UI -->
  <div class="bottom-navbar" id="bottom-nav">
    <div class="page-bubble" id="page-bubble-text">1 / 1 ページ</div>
    <input type="range" class="slider-input" id="page-slider" min="0" max="1" value="0" oninput="onSliderChange(this.value)">
  </div>

  <script src="data.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const articleId = params.get('id') || 'kajin';
    const currentArticle = typeof allArticles !== 'undefined' ? allArticles.find(item => item.id === articleId) : null;

    const container = document.getElementById('viewport-container');
    const novelText = document.getElementById('novel-text');
    const paperEl = document.getElementById('book-paper-el');

    // 文字数の自動計算＆表示同期
    function syncCharCount() {
      const fullText = novelText.innerText.replace(/\s+/g, '');
      const countStr = fullText.length.toLocaleString() + '文字';
      document.getElementById('tobira-count-text').innerText = countStr;
    }

    if (currentArticle) {
      document.title = `${currentArticle.title}｜北風小僧`;
      document.getElementById('header-title').innerText = currentArticle.title;
      document.getElementById('tobira-title-text').innerText = currentArticle.title;
      document.getElementById('tobira-date-text').innerText = currentArticle.date;

      const genreMap = { "red": "ー小説ー", "blue": "ー評論風ー", "green": "ー随筆ー" };
      if (genreMap[currentArticle.genre]) {
        document.getElementById('tobira-genre-text').innerText = genreMap[currentArticle.genre];
      }
    }

    let bodyPages = 1;
    let currentSheetIndex = 0;

    // URLのpageパラメータがある場合はそのページから開始（しおりから読む）
    const initialPage = params.get('page');
    if (initialPage !== null) {
      currentSheetIndex = parseInt(initialPage);
    }

    // 文字サイズに応じた動的ページ数計算
    function recalcPages() {
      syncCharCount();
      setTimeout(() => {
        const textScrollWidth = novelText.scrollWidth;
        const textClientWidth = novelText.clientWidth;
        bodyPages = Math.max(1, Math.round(textScrollWidth / textClientWidth));
        
        const slider = document.getElementById('page-slider');
        slider.max = bodyPages;
        
        if (currentSheetIndex > bodyPages) currentSheetIndex = bodyPages;
        updateDisplay();
      }, 200);
    }

    function updateDisplay() {
      const header = document.getElementById('page-header');
      const bubble = document.getElementById('page-bubble-text');
      const slider = document.getElementById('page-slider');
      const bmSaved = localStorage.getItem(`bm_${articleId}`);

      if (currentSheetIndex === 0) {
        header.classList.add('hide');
        bubble.innerText = `扉ページ`;
        slider.value = 0;
      } else {
        header.classList.remove('hide');
        document.getElementById('header-page').innerText = `${currentSheetIndex}ページ`;
        
        if (bmSaved && parseInt(bmSaved) === currentSheetIndex) {
          bubble.innerText = `しおり位置 (${currentSheetIndex} / ${bodyPages} ページ)`;
        } else {
          bubble.innerText = `${currentSheetIndex} / ${bodyPages} ページ`;
        }
        slider.value = currentSheetIndex;
      }

      if (bmSaved && parseInt(bmSaved) === currentSheetIndex) {
        document.getElementById('bm-btn').innerText = 'しおり中';
      } else {
        document.getElementById('bm-btn').innerText = 'しおり';
      }

      const offsetPercent = currentSheetIndex * 100;
      container.style.transform = `translateX(${offsetPercent}%)`;
    }

    // 画面タップ処理（中央：メニュー開閉 / 左：次ページ / 右：前ページ）
    paperEl.addEventListener('click', function(e) {
      const rect = paperEl.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const width = rect.width;

      if (clickX > width * 0.3 && clickX < width * 0.7) {
        document.getElementById('top-nav').classList.toggle('active');
        document.getElementById('bottom-nav').classList.toggle('active');
        return;
      }

      if (clickX <= width * 0.3) {
        if (currentSheetIndex < bodyPages) currentSheetIndex++;
      } else if (clickX >= width * 0.7) {
        if (currentSheetIndex > 0) currentSheetIndex--;
      }

      updateDisplay();
    });

    function onSliderChange(val) {
      currentSheetIndex = parseInt(val);
      updateDisplay();
    }

    let currentFontSize = 1.05;
    function changeFontSize(delta) {
      currentFontSize = Math.max(0.6, Math.min(1.4, currentFontSize + delta));
      novelText.style.fontSize = `${currentFontSize}rem`;
      recalcPages();
    }

    function toggleTheme() {
      const isWhite = document.body.classList.toggle('theme-white');
      document.getElementById('theme-btn').innerText = isWhite ? '紙色：純白' : '紙色：生成り';
    }

    // しおり機能（1作品1箇所制限）
    function toggleBookmark() {
      const saved = localStorage.getItem(`bm_${articleId}`);
      
      if (saved && parseInt(saved) === currentSheetIndex) {
        localStorage.removeItem(`bm_${articleId}`);
        alert('しおりを外しました');
      } else {
        localStorage.setItem(`bm_${articleId}`, currentSheetIndex);
        const pageLabel = currentSheetIndex === 0 ? '扉ページ' : `${currentSheetIndex}ページ`;
        alert(`${pageLabel}にしおりを挟みました`);
      }
      updateDisplay();
    }

    window.onload = recalcPages;
  </script>
</body>
</html>
