<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>北風小僧の思考ノート</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Shippori+Mincho:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Shippori Mincho', "Yu Mincho", "MS PMincho", serif;
      background-color: #ffffff;
      color: #111111;
      line-height: 1.9;
      -webkit-font-smoothing: antialiased;
    }

    /* 最上部ランダムカラーバー */
    #top-color-bar {
      height: 5px;
      width: 100%;
      transition: background-color 1s ease;
    }

    /* オープニング演出 */
    #opening {
      position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
      background-color: #111111; color: #ffffff;
      display: flex; justify-content: center; align-items: center;
      z-index: 99999;
      animation: fadeOut 0.8s ease forwards; animation-delay: 2.2s;
    }
    .opening-text {
      font-size: 1.3rem; letter-spacing: 0.25em;
      opacity: 0; transform: translateY(15px);
      animation: fadeInUp 1.2s ease forwards; animation-delay: 0.4s;
    }

    /* ナビゲーションバー */
    .top-nav {
      position: sticky; top: 0; background: rgba(255, 255, 255, 0.98); z-index: 1000;
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 24px; border-bottom: 1px solid #111111;
      backdrop-filter: blur(5px);
    }
    
    .brand-logo {
      font-size: 1.5rem; font-weight: 800; text-decoration: none; color: #000;
      letter-spacing: 0.18em; text-transform: uppercase;
      text-shadow: 0.5px 0 0 #000;
    }

    .nav-right { display: flex; align-items: center; gap: 20px; }
    
    .search-btn { background: none; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 4px; }
    .search-btn svg { width: 18px; height: 18px; stroke: #111; stroke-width: 2.2; fill: none; }

    .menu-btn { background: none; border: none; cursor: pointer; font-size: 1.65rem; color: #111; line-height: 1; padding: 2px; }

    /* 全画面メニュー */
    #overlay-menu {
      position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
      background-color: rgba(10, 10, 10, 0.96); color: #fff;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 10000; opacity: 0; visibility: hidden; transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    #overlay-menu.active { opacity: 1; visibility: visible; }
    .close-btn { position: absolute; top: 24px; right: 28px; font-size: 2.2rem; color: #fff; background: none; border: none; cursor: pointer; }
    .menu-list { list-style: none; text-align: center; }
    .menu-list li { margin: 24px 0; }
    .menu-list a { color: #fff; text-decoration: none; font-size: 1.25rem; letter-spacing: 0.15em; }

    /* 横余白なしのフルサイズ画像スライダー */
    .hero-slider-wrapper {
      width: 100%;
      height: 260px;
      position: relative;
      overflow: hidden;
      cursor: pointer;
      background-color: #f4f4f4;
      margin-bottom: 35px;
    }
    .hero-slide {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-size: cover; background-position: center;
      opacity: 0; transition: opacity 0.8s ease-in-out;
    }
    .hero-slide.active { opacity: 1; }

    /* メインコンテンツ枠 */
    .container { max-width: 680px; margin: 0 auto; padding: 0 24px 45px; }

    /* 見出しヘッダー */
    .section-header {
      display: flex; justify-content: space-between; align-items: flex-end;
      margin-top: 45px; margin-bottom: 20px; border-bottom: 2px solid #111; padding-bottom: 8px;
    }
    .section-h2 { font-size: 1.25rem; font-weight: 700; letter-spacing: 0.08em; }
    .section-sub { font-size: 0.75rem; color: #777; }

    /* 最新の文章 */
    .card-scroll { display: flex; overflow-x: auto; gap: 20px; padding-bottom: 35px; -webkit-overflow-scrolling: touch; }
    .card-item {
      min-width: 230px; max-width: 230px; min-height: 200px; border: 1px solid #e0e0e0;
      padding: 38px 20px; text-decoration: none; color: inherit; background: #fff;
      display: flex; flex-direction: column; justify-content: space-between;
      transition: border-color 0.2s;
    }
    .card-item:hover { border-color: #111; }
    .card-title-wrap { margin-bottom: 20px; }
    .card-title { font-size: 1.05rem; font-weight: 700; line-height: 1.5; }
    .card-meta { font-size: 0.78rem; color: #888; margin-top: 15px; }

    /* 新潮社風ボタン */
    .btn-shincho {
      display: block; text-align: center; border: 1px solid #111; padding: 14px;
      margin: 10px 0 45px; text-decoration: none; color: #111; font-size: 0.9rem;
      font-weight: bold; letter-spacing: 0.1em; background: #fff; cursor: pointer; width: 100%;
      transition: background-color 0.2s ease, color 0.2s ease;
    }
    .btn-shincho:hover, .btn-shincho:active {
      background-color: #111111 !important;
      color: #ffffff !important;
    }

    /* カラーアンダーライン */
    .line-blue   { border-bottom: 3px solid #4ba3e3; padding-bottom: 2px; }
    .line-green  { border-bottom: 3px solid #3cb878; padding-bottom: 2px; }
    .line-red    { border-bottom: 3px solid #f06292; padding-bottom: 2px; }
    .line-yellow { border-bottom: 3px solid #f6d155; padding-bottom: 2px; }

    /* ジャンル（文字を少しだけ太く: font-weight: 600） */
    .genre-list { list-style: none; margin-bottom: 45px; }
    .genre-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 20px; margin-bottom: 12px; text-decoration: none;
      font-weight: 600; font-size: 0.92rem; border-radius: 0px;
      color: #000000 !important; 
      letter-spacing: 0.08em;
      transition: transform 0.15s ease, opacity 0.2s;
    }
    .genre-item:hover { opacity: 0.9; transform: translateY(-1px); }
    
    .genre-blue   { background-color: #5baed7; }
    .genre-green  { background-color: #52be80; }
    .genre-red    { background-color: #f1789a; }
    .genre-yellow { background-color: #f7d358; }

    /* 人気の文章 */
    .popular-list { list-style: none; margin-bottom: 15px; }
    .popular-item { padding: 16px 0; border-bottom: 1px dashed #ddd; text-decoration: none; color: inherit; display: block; }
    .popular-title { font-weight: 700; font-size: 1rem; margin-bottom: 4px; display: inline-block; }

    /* 感想を送る */
    .feedback-box { margin-bottom: 0px; }

    /* フッター黒エリア */
    .footer-dark-section {
      background-color: #111111;
      color: #ffffff;
      width: 100%;
      padding: 50px 24px 40px;
      margin-top: 60px;
    }
    .footer-dark-inner {
      max-width: 680px;
      margin: 0 auto;
      text-align: center;
    }

    /* 連絡先エリア */
    .contact-info-box {
      margin-bottom: 30px;
      padding-bottom: 25px;
      border-bottom: 1px dashed #333333;
      font-size: 0.88rem;
      color: #cccccc;
      line-height: 2.2;
    }
    .contact-info-box a {
      color: #ffffff;
      text-decoration: underline;
    }

    /* フッターナビ */
    .footer-links { list-style: none; text-align: center; font-size: 0.88rem; line-height: 2.5; margin-bottom: 35px; }
    .footer-links a { color: #cccccc; text-decoration: none; transition: color 0.2s; }
    .footer-links a:hover { color: #ffffff; }
    
    .dark-copyright { text-align: center; font-size: 0.82rem; color: #777777; border-top: 1px solid #222222; padding-top: 25px; }

    @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }
  </style>
</head>
<body>

  <!-- 最上部カラーバー -->
  <div id="top-color-bar"></div>

  <!-- 全画面オープニング -->
  <div id="opening">
    <p class="opening-text">思考を紡ぐ場所へ</p>
  </div>

  <!-- ナビゲーション -->
  <div class="top-nav">
    <a href="index.html" class="brand-logo">北風小僧</a>
    <div class="nav-right">
      <button class="search-btn" title="検索">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16" y1="16" x2="21" y2="21"/></svg>
      </button>
      <button class="menu-btn" onclick="toggleMenu()">☰</button>
    </div>
  </div>

  <!-- メニュー -->
  <div id="overlay-menu">
    <button class="close-btn" onclick="toggleMenu()">✕</button>
    <ul class="menu-list">
      <li><a href="list.html">文章一覧</a></li>
      <li><a href="about.html">私について</a></li>
      <li><a href="contact.html">お問い合わせ</a></li>
      <li><a href="contact.html">感想を送る</a></li>
    </ul>
  </div>

  <!-- フルサイズ写真スライダー -->
  <div class="hero-slider-wrapper" onclick="nextSlide()">
    <div class="hero-slide active" style="background-image: url('https://images.unsplash.com/photo-1455390582262-044cdead277a?auto=format&fit=crop&w=1000&q=80');"></div>
    <div class="hero-slide" style="background-image: url('https://images.unsplash.com/photo-1457369804613-52c61a468e7d?auto=format&fit=crop&w=1000&q=80');"></div>
    <div class="hero-slide" style="background-image: url('https://images.unsplash.com/photo-1516979187457-637abb4f9353?auto=format&fit=crop&w=1000&q=80');"></div>
  </div>

  <div class="container">

    <!-- 最新の文章 -->
    <div class="section-header" style="margin-top:0;">
      <h2 class="section-h2">最新の文章</h2>
      <span class="section-sub">NEW</span>
    </div>
    <div class="card-scroll" id="latest-container">
      <!-- JavaScriptで自動描画 -->
    </div>
    <a href="list.html" class="btn-shincho">作品一覧 ＞</a>

    <!-- ジャンル -->
    <div class="section-header">
      <h2 class="section-h2">ジャンル</h2>
      <span class="section-sub">CATEGORIES</span>
    </div>
    <div class="genre-list">
      <a href="list.html?genre=blue" class="genre-item genre-blue"><span>評論もどき</span><span>2 ＞</span></a>
      <a href="list.html?genre=green" class="genre-item genre-green"><span>随筆</span><span>5 ＞</span></a>
      <a href="list.html?genre=red" class="genre-item genre-red"><span>小説</span><span>4 ＞</span></a>
      <a href="list.html?genre=yellow" class="genre-item genre-yellow"><span>詩歌</span><span>1 ＞</span></a>
    </div>

    <!-- 人気の文章 -->
    <div class="section-header">
      <h2 class="section-h2">人気の文章</h2>
      <span class="section-sub">POPULAR</span>
    </div>
    <div class="popular-list" id="popular-container">
      <!-- JavaScriptで自動描画 -->
    </div>
    <a href="list.html?sort=popular" class="btn-shincho">すべて見る ＞</a>

    <!-- 感想を送る -->
    <div class="section-header">
      <h2 class="section-h2">感想を送る</h2>
      <span class="section-sub">FEEDBACK</span>
    </div>
    <div class="feedback-box">
      <a href="contact.html" class="btn-shincho">作品の感想・メッセージを送る ＞</a>
    </div>

  </div>

  <!-- フッター黒エリア -->
  <div class="footer-dark-section">
    <div class="footer-dark-inner">
      
      <div class="contact-info-box">
        <p>Gmail: <a href="mailto:xxx@gmail.com">xxx@gmail.com</a></p>
        <p>Twitter (X): <a href="https://twitter.com/xxx" target="_blank" rel="noopener">@xxx</a></p>
      </div>

      <!-- フッターナビ -->
      <ul class="footer-links">
        <li><a href="about.html">私について</a></li>
        <li><a href="terms.html">サイトのご利用について</a></li>
        <li><a href="help.html">ヘルプ</a></li>
        <li><a href="contact.html">お問い合わせ</a></li>
      </ul>

      <div class="dark-copyright">&copy; 北風小僧</div>
    </div>
  </div>

  <script>
    /* 文章データ */
    const articles = [
      { title: "作品タイトル5", url: "article5.html", date: "2026.08.27", length: "約1,500字", colorClass: "line-blue" },
      { title: "作品タイトル4", url: "article4.html", date: "2026.08.26", length: "約1,000字", colorClass: "line-red" },
      { title: "恐怖の構造", url: "article2.html", date: "2026.08.26", length: "約1,200字", colorClass: "line-blue" },
      { title: "はじめに", url: "hajimene.html", date: "2026.08.21", length: "約300字", colorClass: "line-green" },
      { title: "旧作品1", url: "article1.html", date: "2026.07.29", length: "約2,000字", colorClass: "line-yellow" },
      { title: "旧作品2", url: "article0.html", date: "2026.07.15", length: "約800字", colorClass: "line-green" }
    ];

    /* 人気の文章リスト */
    const popularArticles = [
      { rank: 1, title: "恐怖の構造", url: "article2.html", date: "2026.08.26", length: "約1,200字", colorClass: "line-blue" },
      { rank: 2, title: "はじめに", url: "hajimene.html", date: "2026.08.21", length: "約300字", colorClass: "line-green" },
      { rank: 3, title: "作品タイトル5", url: "article5.html", date: "2026.08.27", length: "約1,500字", colorClass: "line-blue" },
      { rank: 4, title: "作品タイトル4", url: "article4.html", date: "2026.08.26", length: "約1,000字", colorClass: "line-red" },
      { rank: 5, title: "旧作品1", url: "article1.html", date: "2026.07.29", length: "約2,000字", colorClass: "line-yellow" }
    ];

    /* カラーバー自動切り替え */
    const colors = ['#5baed7', '#52be80', '#f1789a', '#f7d358'];
    function changeBarColor() {
      const randomColor = colors[Math.floor(Math.random() * colors.length)];
      document.getElementById('top-color-bar').style.backgroundColor = randomColor;
    }
    changeBarColor();
    setInterval(changeBarColor, 20000);

    /* 画像スライダー制御（5秒自動 ＆ タップ切替） */
    let currentSlide = 0;
    const slides = document.querySelectorAll('.hero-slide');
    
    function nextSlide() {
      slides[currentSlide].classList.remove('active');
      currentSlide = (currentSlide + 1) % slides.length;
      slides[currentSlide].classList.add('active');
    }
    let slideTimer = setInterval(nextSlide, 5000);

    document.querySelector('.hero-slider-wrapper').addEventListener('click', () => {
      clearInterval(slideTimer);
      slideTimer = setInterval(nextSlide, 5000);
    });

    /* 最新文章の描画 */
    const latestContainer = document.getElementById('latest-container');
    const latestArticles = articles.slice(0, 5);
    latestArticles.forEach(item => {
      latestContainer.innerHTML += `
        <a href="${item.url}" class="card-item">
          <div class="card-title-wrap">
            <span class="card-title"><span class="${item.colorClass}">${item.title}</span></span>
          </div>
          <div class="card-meta">${item.date}｜${item.length}</div>
        </a>
      `;
    });

    /* 人気文章（TOP5件を表示） */
    function renderPopular() {
      const container = document.getElementById('popular-container');
      container.innerHTML = '';
      
      popularArticles.forEach(item => {
        container.innerHTML += `
          <a href="${item.url}" class="popular-item">
            ${item.rank}. <span class="popular-title"><span class="${item.colorClass}">${item.title}</span></span>
            <div class="card-meta">${item.date}｜${item.length}</div>
          </a>
        `;
      });
    }
    renderPopular();

    /* メニュー開閉 */
    function toggleMenu() {
      document.getElementById('overlay-menu').classList.toggle('active');
    }
  </script>
</body>
</html>
