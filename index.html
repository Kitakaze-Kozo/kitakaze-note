<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>北風小僧の思考ノート</title>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Shippori Mincho', "Yu Mincho", "MS PMincho", serif;
      background-color: #ffffff;
      color: #111111;
      line-height: 1.9;
      -webkit-font-smoothing: antialiased;
    }

    /* 1. 最上部のランダム＆20秒ごとに変わるカラーバー */
    #top-color-bar {
      height: 5px;
      width: 100%;
      transition: background-color 1s ease;
    }

    /* オープニング演出（句読点なし） */
    #opening {
      position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
      background-color: #111111; color: #ffffff;
      display: flex; justify-content: center; align-items: center;
      z-index: 99999;
      animation: fadeOut 0.8s ease forwards; animation-delay: 2.2s;
    }
    .opening-text {
      font-size: 1.3rem; letter-spacing: 0.25em;
      opacity: 0; transform: translateY(15px);
      animation: fadeInUp 1.2s ease forwards; animation-delay: 0.4s;
    }

    /* 上部ナビゲーション（ロゴサイズ調整・マーク削除） */
    .top-nav {
      position: sticky; top: 0; background: rgba(255, 255, 255, 0.98); z-index: 1000;
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 24px; border-bottom: 1px solid #e0e0e0;
      backdrop-filter: blur(5px);
    }
    .brand-logo {
      font-size: 1.4rem; font-weight: 700; text-decoration: none; color: #111;
      letter-spacing: 0.08em;
    }

    .nav-right { display: flex; align-items: center; gap: 18px; }
    /* 検索を虫眼鏡マークのみに変更 */
    .search-btn { background: none; border: none; cursor: pointer; font-size: 1.2rem; color: #111; }
    .menu-btn { background: none; border: none; cursor: pointer; font-size: 1.4rem; color: #111; }

    /* 全画面メニュー */
    #overlay-menu {
      position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
      background-color: rgba(10, 10, 10, 0.95); color: #fff;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 10000; opacity: 0; visibility: hidden; transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    #overlay-menu.active { opacity: 1; visibility: visible; }
    .close-btn { position: absolute; top: 24px; right: 28px; font-size: 2.2rem; color: #fff; background: none; border: none; cursor: pointer; }
    .menu-list { list-style: none; text-align: center; }
    .menu-list li { margin: 24px 0; }
    .menu-list a { color: #fff; text-decoration: none; font-size: 1.25rem; letter-spacing: 0.15em; }

    /* コンテナ */
    .container { max-width: 680px; margin: 0 auto; padding: 30px 24px 60px; }
    
    .section-header {
      display: flex; justify-content: space-between; align-items: flex-end;
      margin-top: 45px; margin-bottom: 20px; border-bottom: 2px solid #111; padding-bottom: 8px;
    }
    .section-h2 { font-size: 1.25rem; font-weight: 700; letter-spacing: 0.08em; }
    .section-sub { font-size: 0.75rem; color: #777; }

    /* 最新の文章（新潮社風：カードの下に十分な余白を持たせる） */
    .card-scroll { display: flex; overflow-x: auto; gap: 20px; padding-bottom: 35px; -webkit-overflow-scrolling: touch; }
    .card-item {
      min-width: 230px; max-width: 230px; border: 1px solid #e0e0e0;
      padding: 22px 18px; text-decoration: none; color: inherit; background: #fff;
      display: flex; flex-direction: column; justify-content: space-between;
      transition: border-color 0.2s;
    }
    .card-item:hover { border-color: #111; }
    .card-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 12px; line-height: 1.5; }
    .card-meta { font-size: 0.78rem; color: #888; }
    
    .btn-all {
      display: block; text-align: center; border: 1px solid #111; padding: 12px;
      margin: 10px 0 45px; text-decoration: none; color: #111; font-size: 0.9rem;
      font-weight: bold; letter-spacing: 0.08em;
    }

    /* 短いカラーバー（見出し下） */
    .line-blue   { border-bottom: 3px solid #00a0dc; padding-bottom: 2px; }
    .line-green  { border-bottom: 3px solid #00b46e; padding-bottom: 2px; }
    .line-red    { border-bottom: 3px solid #ff3c6e; padding-bottom: 2px; }
    .line-yellow { border-bottom: 3px solid #ffd200; padding-bottom: 2px; }

    /* 長方形・単色のジャンル枠（角丸・グラデーションなし） */
    .genre-list { list-style: none; margin-bottom: 45px; }
    .genre-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 20px; margin-bottom: 12px; text-decoration: none; color: #111;
      font-weight: 700; font-size: 1rem; border-radius: 0px; /* 完全な長方形 */
    }
    .genre-blue   { background-color: #00a0dc; color: #fff; }
    .genre-green  { background-color: #00b46e; color: #fff; }
    .genre-red    { background-color: #ff3c6e; color: #fff; }
    .genre-yellow { background-color: #ffd200; color: #111; }

    /* 人気の文章 */
    .popular-list { list-style: none; margin-bottom: 15px; }
    .popular-item { padding: 16px 0; border-bottom: 1px dashed #ddd; text-decoration: none; color: inherit; display: block; }
    .popular-title { font-weight: 700; font-size: 1rem; margin-bottom: 4px; display: inline-block; }

    /* フッター領域 */
    .about-site-box { background: #fbfbfb; border: 1px solid #eaeaea; padding: 26px; text-align: center; margin-top: 50px; margin-bottom: 35px; }
    .about-site-box h3 { font-size: 1.1rem; margin-bottom: 12px; }
    .sns-links { font-size: 0.88rem; color: #555; line-height: 2; }

    .footer-links { list-style: none; text-align: center; font-size: 0.88rem; line-height: 2.4; margin-bottom: 35px; }
    .footer-links a { color: #444; text-decoration: none; }
    
    footer { text-align: center; font-size: 0.82rem; color: #888; border-top: 1px solid #eee; padding-top: 25px; }

    @keyframes fadeInUp { to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }
  </style>
</head>
<body>

  <!-- 最上部の自動切替カラーバー -->
  <div id="top-color-bar"></div>

  <!-- 全画面オープニング演出（「。」なし） -->
  <div id="opening">
    <p class="opening-text">思考を紡ぐ場所へ</p>
  </div>

  <!-- 上部ナビゲーション -->
  <div class="top-nav">
    <a href="index.html" class="brand-logo">北風小僧</a>
    <div class="nav-right">
      <button class="search-btn" title="検索">🔍</button>
      <button class="menu-btn" onclick="toggleMenu()">☰</button>
    </div>
  </div>

  <!-- 全画面オーバーレイメニュー -->
  <div id="overlay-menu">
    <button class="close-btn" onclick="toggleMenu()">✕</button>
    <ul class="menu-list">
      <li><a href="index.html">ホーム</a></li>
      <li><a href="list.html">文章一覧</a></li>
      <li><a href="about.html">私について</a></li>
      <li><a href="contact.html">お問合せ</a></li>
    </ul>
  </div>

  <div class="container">

    <!-- 最新の文章（最大5件を表示） -->
    <div class="section-header" style="margin-top:0;">
      <h2 class="section-h2">最新の文章</h2>
      <span class="section-sub">NEW</span>
    </div>
    <div class="card-scroll" id="latest-container">
      <!-- JavaScriptにより最新5件が自動展開されます -->
    </div>
    <a href="list.html" class="btn-all">文章一覧 ＞</a>

    <!-- ジャンル（単色・長方形） -->
    <div class="section-header">
      <h2 class="section-h2">ジャンル</h2>
      <span class="section-sub">CATEGORIES</span>
    </div>
    <div class="genre-list">
      <a href="list.html" class="genre-item genre-blue"><span>評論もどき</span><span>2 ＞</span></a>
      <a href="list.html" class="genre-item genre-green"><span>随筆</span><span>5 ＞</span></a>
      <a href="list.html" class="genre-item genre-red"><span>小説</span><span>4 ＞</span></a>
      <a href="list.html" class="genre-item genre-yellow"><span>詩歌</span><span>1 ＞</span></a>
    </div>

    <!-- 人気の文章（初期5件／すべて見るで10件） -->
    <div class="section-header">
      <h2 class="section-h2">人気の文章</h2>
      <span class="section-sub">POPULAR</span>
    </div>
    <div class="popular-list" id="popular-container">
      <!-- JavaScriptにより人気記事が表示されます -->
    </div>
    <button id="show-more-popular" class="btn-all" onclick="showMorePopular()" style="width:100%; cursor:pointer; background:none;">すべて見る ＞</button>

    <!-- このサイトについて -->
    <div class="about-site-box">
      <h3>このサイトについて</h3>
      <div class="sns-links">
        <p>Gmail: xxx@gmail.com</p>
        <p>X (Twitter): @xxx</p>
      </div>
    </div>

    <!-- フッターリンク（私について、サイトのご利用） -->
    <ul class="footer-links">
      <li><a href="about.html">私について</a></li>
      <li><a href="terms.html">サイトのご利用</a></li>
      <li><a href="help.html">ヘルプ</a></li>
      <li><a href="contact.html">お問合せ</a></li>
    </ul>

    <footer>&copy; 北風小僧</footer>

  </div>

  <script>
    /* ========================================================
       1. 文章データ管理（追加時は配列の「一番上」に書いてください）
       ※左から順（最新順）に並び、自動的にトップ5件が最新欄に置かれます。
    ======================================================== */
    const articles = [
      { title: "作品タイトル5", url: "article5.html", date: "2026.08.27", length: "約1,500字", colorClass: "line-blue" },
      { title: "作品タイトル4", url: "article4.html", date: "2026.08.26", length: "約1,000字", colorClass: "line-red" },
      { title: "恐怖の構造", url: "article2.html", date: "2026.08.26", length: "約1,200字", colorClass: "line-blue" },
      { title: "はじめに", url: "hajimene.html", date: "2026.08.21", length: "約300字", colorClass: "line-green" },
      { title: "旧作品1", url: "article1.html", date: "2026.07.29", length: "約2,000字", colorClass: "line-yellow" },
      { title: "旧作品2", url: "article0.html", date: "2026.07.15", length: "約800字", colorClass: "line-green" }
    ];

    /* 人気の文章リスト（最大10個設定） */
    const popularArticles = [
      { rank: 1, title: "恐怖の構造", url: "article2.html", date: "2026.08.26", length: "約1,200字", colorClass: "line-blue" },
      { rank: 2, title: "はじめに", url: "hajimene.html", date: "2026.08.21", length: "約300字", colorClass: "line-green" },
      { rank: 3, title: "作品タイトル5", url: "article5.html", date: "2026.08.27", length: "約1,500字", colorClass: "line-blue" },
      { rank: 4, title: "作品タイトル4", url: "article4.html", date: "2026.08.26", length: "約1,000字", colorClass: "line-red" },
      { rank: 5, title: "旧作品1", url: "article1.html", date: "2026.07.29", length: "約2,000字", colorClass: "line-yellow" },
      /* 以下「すべて見る」で表示される6〜10位 */
      { rank: 6, title: "人気の文章 6", url: "#", date: "2026.06.10", length: "約1,100字", colorClass: "line-green" },
      { rank: 7, title: "人気の文章 7", url: "#", date: "2026.06.01", length: "約900字", colorClass: "line-blue" },
      { rank: 8, title: "人気の文章 8", url: "#", date: "2026.05.20", length: "約1,800字", colorClass: "line-red" },
      { rank: 9, title: "人気の文章 9", url: "#", date: "2026.05.11", length: "約700字", colorClass: "line-yellow" },
      { rank: 10, title: "人気の文章 10", url: "#", date: "2026.04.30", length: "約2,500字", colorClass: "line-blue" }
    ];

    /* 2. 最上部バーの色ランダム＆20秒切替制御 */
    const colors = ['#00a0dc', '#00b46e', '#ff3c6e', '#ffd200'];
    function changeBarColor() {
      const randomColor = colors[Math.floor(Math.random() * colors.length)];
      document.getElementById('top-color-bar').style.backgroundColor = randomColor;
    }
    changeBarColor();
    setInterval(changeBarColor, 20000); // 20秒（20000ミリ秒）ごと

    /* 3. 最新文章（最大5件）の初期描画 */
    const latestContainer = document.getElementById('latest-container');
    const latestArticles = articles.slice(0, 5); // 先頭（最新）の5つを取得
    latestArticles.forEach(item => {
      latestContainer.innerHTML += `
        <a href="${item.url}" class="card-item">
          <div><span class="card-title"><span class="${item.colorClass}">${item.title}</span></span></div>
          <div class="card-meta">${item.date}｜${item.length}</div>
        </a>
      `;
    });

    /* 4. 人気文章の描画制御 */
    function renderPopular(limit) {
      const container = document.getElementById('popular-container');
      container.innerHTML = '';
      const list = popularArticles.slice(0, limit);
      list.forEach(item => {
        container.innerHTML += `
          <a href="${item.url}" class="popular-item">
            ${item.rank}. <span class="popular-title"><span class="${item.colorClass}">${item.title}</span></span>
            <div class="card-meta">${item.date}｜${item.length}</div>
          </a>
        `;
      });
    }
    renderPopular(5); // 初期は5個表示

    function showMorePopular() {
      renderPopular(10); // 10個表示に変更
      document.getElementById('show-more-popular').style.display = 'none'; // ボタンを非表示
    }

    /* メニュー開閉 */
    function toggleMenu() {
      document.getElementById('overlay-menu').classList.toggle('active');
    }
  </script>
</body>
</html>
