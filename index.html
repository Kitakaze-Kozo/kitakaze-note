<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>北風小僧の思考ノート</title>
  <!-- 高級感のある明朝体フォント（Shippori Mincho）を読み込み -->
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Shippori Mincho', "Yu Mincho", "MS PMincho", serif;
      background-color: #ffffff;
      color: #111111;
      line-height: 1.6;
    }

    /* オープニング演出 */
    #opening {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      background-color: #1a1a1a;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      animation: fadeOut 0.8s ease forwards;
      animation-delay: 2.0s;
    }
    .opening-text {
      font-size: 1.2rem;
      letter-spacing: 0.2em;
      opacity: 0;
      transform: translateY(15px);
      animation: fadeInUp 1.2s ease forwards;
      animation-delay: 0.3s;
    }

    /* ヘッダー */
    header {
      padding: 30px 20px 20px;
      border-bottom: 1px solid #eee;
      max-width: 800px;
      margin: 0 auto;
    }
    .site-title {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 0.05em;
    }
    .subtitle {
      color: #777;
      font-size: 0.85rem;
      margin-top: 4px;
    }

    /* メインエリア */
    #main-content {
      opacity: 0;
      max-width: 800px;
      margin: 0 auto;
      padding: 30px 0;
      animation: fadeInMain 1s ease forwards;
      animation-delay: 2.4s;
    }

    /* 新潮社風 タブ・見出し */
    .section-title {
      padding: 0 20px;
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
    }
    .section-title::after {
      content: "";
      flex: 1;
      height: 1px;
      background-color: #eee;
      margin-left: 15px;
    }

    /* 横スクロール型のカード配置 */
    .card-container {
      display: flex;
      overflow-x: auto;
      padding: 10px 20px 25px;
      gap: 16px;
      -webkit-overflow-scrolling: touch;
    }
    /* スクロールバーをすっきり見せる設定 */
    .card-container::-webkit-scrollbar {
      height: 4px;
    }
    .card-container::-webkit-scrollbar-thumb {
      background: #ddd;
      border-radius: 2px;
    }

    /* 記事カード（新潮社デザイン再現） */
    .card {
      min-width: 260px;
      max-width: 260px;
      background: #fff;
      border: 1px solid #e2e2e2;
      padding: 24px 20px;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      transition: border-color 0.2s ease, transform 0.2s ease;
    }
    .card:active {
      transform: translateY(2px);
    }

    /* カテゴリー見出しと黄色のアクセント線 */
    .card-category {
      font-size: 0.95rem;
      font-weight: 700;
      display: inline-block;
      margin-bottom: 8px;
      position: relative;
    }
    .card-category::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -4px;
      width: 100%;
      height: 3px;
      background-color: #ffd700; /* 新潮社風のイエロー */
    }

    .card-date {
      font-size: 0.75rem;
      color: #888;
      margin-top: 12px;
      margin-bottom: 8px;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      line-height: 1.5;
      color: #222;
    }

    footer {
      text-align: center;
      color: #aaa;
      font-size: 0.8rem;
      padding: 40px 0;
      border-top: 1px solid #eee;
      margin-top: 20px;
    }

    /* アニメーション */
    @keyframes fadeInUp {
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeOut {
      to { opacity: 0; visibility: hidden; }
    }
    @keyframes fadeInMain {
      to { opacity: 1; }
    }
  </style>
</head>
<body>

  <!-- オープニング -->
  <div id="opening">
    <p class="opening-text">思考を紡ぐ場所へ。</p>
  </div>

  <header>
    <div class="site-title">北風小僧の思考ノート</div>
    <div class="subtitle">日々の独り言と日記</div>
  </header>

  <!-- メインコンテンツ -->
  <div id="main-content">
    <div class="section-title">最新のノート</div>

    <!-- 横にスワイプできるカード一覧 -->
    <div class="card-container">

      <!-- カード1（はじめに） -->
      <a href="hajimene.html" class="card">
        <div>
          <span class="card-category">はじめに</span>
        </div>
        <div class="card-date">2026.08.21</div>
        <div class="card-title">ホームページを開設しました。日々の思考を自由に綴っていきます。</div>
      </a>

      <!-- カード2 -->
      <a href="article2.html" class="card">
        <div>
          <span class="card-category">思考</span>
        </div>
        <div class="card-date">2026.08.22</div>
        <div class="card-title">デザインと世界観についての考察</div>
      </a>

      <!-- カード3 -->
      <a href="article3.html" class="card">
        <div>
          <span class="card-category">日記</span>
        </div>
        <div class="card-date">2026.08.23</div>
        <div class="card-title">風の冷たい日に考えたこと</div>
      </a>

    </div>

    <footer>&copy; 北風小僧</footer>
  </div>

</body>
</html>
