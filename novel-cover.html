<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作品カバー｜北風小僧</title>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Shippori Mincho', "Yu Mincho", "MS PMincho", serif;
      background-color: #fcfcfc;
      color: #111111;
      line-height: 1.8;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* 上部ナビゲーション */
    .top-nav {
      position: sticky; top: 0; background: rgba(255, 255, 255, 0.98); z-index: 1000;
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 24px; border-bottom: 1px solid #111111;
      backdrop-filter: blur(5px);
    }
    .brand-logo {
      font-size: 1.5rem; font-weight: 800; text-decoration: none; color: #000;
      letter-spacing: 0.18em; text-transform: uppercase;
      text-shadow: 0.5px 0 0 #000;
    }
    .nav-right { display: flex; align-items: center; gap: 20px; }
    .search-btn { background: none; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 4px; }
    .search-btn svg { width: 18px; height: 18px; stroke: #111; stroke-width: 2.2; fill: none; }
    .menu-btn { background: none; border: none; cursor: pointer; font-size: 1.65rem; color: #111; line-height: 1; padding: 2px; }

    #overlay-menu {
      position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
      background-color: rgba(10, 10, 10, 0.96); color: #fff;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 10000; opacity: 0; visibility: hidden; transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    #overlay-menu.active { opacity: 1; visibility: visible; }
    .close-btn { position: absolute; top: 24px; right: 28px; font-size: 2.2rem; color: #fff; background: none; border: none; cursor: pointer; }
    .menu-list { list-style: none; text-align: center; }
    .menu-list li { margin: 24px 0; }
    .menu-list a { color: #fff; text-decoration: none; font-size: 1.25rem; letter-spacing: 0.15em; }

    /* カバーエリア */
    .cover-container {
      max-width: 500px;
      margin: 40px auto 60px;
      padding: 0 24px;
      width: 100%;
      text-align: center;
    }

    .book-cover-card {
      border: 1px solid #111;
      background-color: #fff;
      padding: 60px 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      margin-bottom: 35px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 380px;
      position: relative;
    }

    .book-genre-tag {
      position: absolute;
      top: 20px;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      color: #666;
    }

    .book-title {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: 0.15em;
      line-height: 1.4;
      margin: 20px 0;
      word-break: break-word;
    }

    .book-author {
      font-size: 0.95rem;
      letter-spacing: 0.12em;
      color: #333;
      margin-top: 10px;
    }

    .book-meta {
      font-size: 0.85rem;
      color: #777;
      margin-top: 15px;
    }

    /* ボタンエリアグループ */
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }

    /* 読むボタン */
    .btn-read {
      display: block;
      width: 100%;
      border: 1px solid #111;
      background-color: #111;
      color: #fff;
      padding: 16px;
      text-decoration: none;
      font-size: 1rem;
      font-weight: bold;
      letter-spacing: 0.15em;
      text-align: center;
      transition: background-color 0.2s, color 0.2s;
      cursor: pointer;
    }
    .btn-read:hover {
      background-color: #333;
    }

    /* しおりから読むボタン */
    .btn-bookmark {
      display: none; /* 初期状態は非表示 */
      width: 100%;
      border: 1px solid #111;
      background-color: #fff;
      color: #111;
      padding: 14px;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: bold;
      letter-spacing: 0.12em;
      text-align: center;
      transition: background-color 0.2s;
      cursor: pointer;
    }
    .btn-bookmark:hover {
      background-color: #f0f0f0;
    }

    /* ダークフッター */
    .footer-dark-section {
      background-color: #111111;
      color: #ffffff;
      width: 100%;
      padding: 50px 24px 40px;
      margin-top: auto;
    }
    .footer-dark-inner { max-width: 680px; margin: 0 auto; text-align: center; }
    .contact-info-box {
      margin-bottom: 30px; padding-bottom: 25px; border-bottom: 1px dashed #333333;
      font-size: 0.88rem; color: #cccccc; line-height: 2.2;
    }
    .contact-info-box a { color: #ffffff; text-decoration: underline; }
    .footer-links { list-style: none; text-align: center; font-size: 0.88rem; line-height: 2.5; margin-bottom: 35px; }
    .footer-links a { color: #cccccc; text-decoration: none; transition: color 0.2s; }
    .footer-links a:hover { color: #ffffff; }
    .dark-copyright { text-align: center; font-size: 0.82rem; color: #777777; border-top: 1px solid #222222; padding-top: 25px; }

    /* 検索モーダル */
    #search-modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
      background: rgba(10, 10, 10, 0.95); z-index: 20000; display: none;
      align-items: center; justify-content: center; padding: 20px; color: #fff;
    }
    #search-modal.active { display: flex; }
    .search-box { width: 100%; max-width: 500px; }
    .search-input {
      width: 100%; padding: 14px; font-size: 1.1rem; background: #222; border: 1px solid #444;
      color: #fff; font-family: inherit; outline: none; margin-bottom: 20px;
    }
    .search-results { list-style: none; max-height: 300px; overflow-y: auto; text-align: left; }
    .search-results li { border-bottom: 1px solid #333; padding: 12px 0; }
    .search-results a { text-decoration: none; color: #fff; display: block; }
    .search-close-btn { background: none; border: 1px solid #fff; color: #fff; padding: 10px 20px; margin-top: 20px; cursor: pointer; width: 100%; font-family: inherit; }
  </style>
</head>
<body>

  <!-- ナビゲーション -->
  <div class="top-nav">
    <a href="index.html" class="brand-logo">北風小僧</a>
    <div class="nav-right">
      <button class="search-btn" title="検索" onclick="toggleSearch()">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16" y1="16" x2="21" y2="21"/></svg>
      </button>
      <button class="menu-btn" onclick="toggleMenu()">☰</button>
    </div>
  </div>

  <div id="overlay-menu">
    <button class="close-btn" onclick="toggleMenu()">✕</button>
    <ul class="menu-list">
      <li><a href="list.html">作品一覧</a></li>
      <li><a href="about.html">私について</a></li>
      <li><a href="contact.html">お問い合わせ</a></li>
      <li><a href="contact.html">感想を送る</a></li>
    </ul>
  </div>

  <div id="search-modal">
    <div class="search-box">
      <input type="text" id="search-input" class="search-input" placeholder="作品名やキーワードを入力..." oninput="execSearch()">
      <ul class="search-results" id="search-results"></ul>
      <button class="search-close-btn" onclick="toggleSearch()">閉じる</button>
    </div>
  </div>

  <!-- カバーメイン表示 -->
  <div class="cover-container">
    <div class="book-cover-card">
      <div class="book-genre-tag" id="cover-genre">― 小説 ―</div>
      <h1 class="book-title" id="cover-title">作品タイトル</h1>
      <div class="book-author">北風小僧</div>
      <div class="book-meta" id="cover-meta">2026.00.00｜0文字</div>
    </div>

    <div class="btn-group">
      <!-- 作品を読むボタン -->
      <a href="#" id="read-btn" class="btn-read">作品を読む ＞</a>
      
      <!-- しおりを指している場合のみ表示されるボタン -->
      <a href="#" id="bookmark-btn" class="btn-bookmark">🔖 しおりから読む</a>
    </div>
  </div>

  <!-- フッター -->
  <div class="footer-dark-section">
    <div class="footer-dark-inner">
      <div class="contact-info-box">
        <p>Gmail: <a href="mailto:xxx@gmail.com">xxx@gmail.com</a></p>
        <p>Twitter (X): <a href="https://twitter.com/xxx" target="_blank" rel="noopener">@xxx</a></p>
      </div>
      <ul class="footer-links">
        <li><a href="about.html">私について</a></li>
        <li><a href="terms.html">サイトのご利用について</a></li>
        <li><a href="help.html">ヘルプ</a></li>
        <li><a href="contact.html">お問い合わせ</a></li>
      </ul>
      <div class="dark-copyright">&copy; 北風小僧</div>
    </div>
  </div>

  <script src="data.js"></script>
  <script>
    // URLから作品IDを取得
    const params = new URLSearchParams(window.location.search);
    const articleId = params.get('id');

    // data.js から対象データを検索
    const currentArticle = allArticles.find(item => item.id === articleId);

    if (currentArticle) {
      document.title = `${currentArticle.title}｜北風小僧`;
      document.getElementById('cover-genre').innerText = `― ${genreNames[currentArticle.genre] || '小説'} ―`;
      document.getElementById('cover-title').innerText = currentArticle.title;
      
      // リーダー画面と統一された文字数表示（charCountの数値フォーマット変換またはlength）
      const charCountStr = currentArticle.charCount !== undefined 
        ? `${currentArticle.charCount.toLocaleString()}文字` 
        : (currentArticle.length || '0文字');

      document.getElementById('cover-meta').innerText = `${currentArticle.date}｜${charCountStr}`;
      
      // 縦書きリーダー画面へのリンク
      document.getElementById('read-btn').href = `novel-reader.html?id=${currentArticle.id}`;

      // しおり情報の判定と処理（1作品につき1箇所）
      const savedBookmark = localStorage.getItem(`bm_${currentArticle.id}`);
      if (savedBookmark !== null) {
        const pageNum = parseInt(savedBookmark);
        const pageText = pageNum === 0 ? '扉' : `${pageNum}ページ`;
        const bmBtn = document.getElementById('bookmark-btn');
        
        bmBtn.style.display = 'block';
        bmBtn.innerText = `🔖 しおりから読む (${pageText})`;
        bmBtn.href = `novel-reader.html?id=${currentArticle.id}&page=${pageNum}`;
      }
    } else {
      document.getElementById('cover-title').innerText = '作品が見つかりません';
      document.getElementById('read-btn').style.display = 'none';
    }

    function toggleMenu() {
      document.getElementById('overlay-menu').classList.toggle('active');
    }

    function toggleSearch() {
      const modal = document.getElementById('search-modal');
      modal.classList.toggle('active');
      if (modal.classList.contains('active')) document.getElementById('search-input').focus();
    }

    function execSearch() {
      const query = document.getElementById('search-input').value.toLowerCase().trim();
      const resultsContainer = document.getElementById('search-results');
      resultsContainer.innerHTML = '';
      if (!query) return;

      const filtered = allArticles.filter(item => 
        item.title.toLowerCase().includes(query) || 
        (genreNames[item.genre] && genreNames[item.genre].includes(query))
      );

      if (filtered.length === 0) {
        resultsContainer.innerHTML = '<li style="color:#aaa;">該当する作品が見つかりません</li>';
        return;
      }

      filtered.forEach(item => {
        resultsContainer.innerHTML += `
          <li>
            <a href="${item.url}">
              <strong>${item.title}</strong>
              <div style="font-size:0.8rem; color:#888;">${item.date}｜${genreNames[item.genre]}｜${item.length}</div>
            </a>
          </li>
        `;
      });
    }
  </script>
</body>
</html>
