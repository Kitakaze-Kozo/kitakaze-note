<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作品詳細｜北風小僧</title>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Shippori Mincho', serif; background-color: #ffffff; color: #111111; line-height: 1.8; }
    
    .top-nav {
      position: sticky; top: 0; background: rgba(255, 255, 255, 0.98); z-index: 1000;
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 20px; border-bottom: 1px solid #111111;
    }
    .brand-logo { font-size: 1.3rem; font-weight: 800; text-decoration: none; color: #111111; letter-spacing: 0.15em; }
    .nav-right { display: flex; align-items: center; gap: 16px; }
    .icon-btn { background: none; border: none; cursor: pointer; font-size: 1.2rem; color: #111111; }
    
    .container { max-width: 500px; margin: 0 auto; padding: 40px 24px 60px; text-align: center; }
    .title-area { text-align: left; margin-bottom: 25px; }
    .work-title { font-size: 2rem; font-weight: 800; letter-spacing: 0.1em; margin-bottom: 8px; }
    .title-divider { border: 0; border-top: 2px solid #111111; margin-bottom: 12px; }
    .meta-info { display: flex; justify-content: space-between; font-size: 0.9rem; color: #444444; }
    .genre-label { font-size: 1.1rem; font-weight: 700; text-align: left; margin-bottom: 50px; }
    
    .btn-group { display: flex; flex-direction: column; gap: 15px; align-items: center; margin-top: 50px; }
    .read-btn {
      display: block; width: 100%; max-width: 300px; padding: 16px 0; border: 2px solid #111111;
      background: #ffffff; color: #111111; font-family: inherit; font-size: 1.2rem; font-weight: 700;
      letter-spacing: 0.2em; text-decoration: none; text-align: center; cursor: pointer;
    }
    .read-btn.primary { background: #111111; color: #ffffff; }

    /* 検索モーダル UI */
    #search-modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
      background: rgba(0,0,0,0.85); z-index: 10000; display: none;
      align-items: center; justify-content: center; padding: 20px;
    }
    .search-box { background: #fff; width: 100%; max-width: 400px; padding: 20px; border-radius: 4px; }
    .search-input { width: 100%; padding: 10px; font-size: 1rem; margin-bottom: 15px; font-family: inherit; }
    .search-results { list-style: none; max-height: 200px; overflow-y: auto; text-align: left; }
    .search-results li { padding: 8px 0; border-bottom: 1px solid #eee; }
    .search-results a { text-decoration: none; color: #111; font-weight: bold; }
  </style>
</head>
<body>

  <div class="top-nav">
    <a href="index.html" class="brand-logo">北風小僧</a>
    <div class="nav-right">
      <button class="icon-btn" onclick="openSearch()">🔍</button>
      <button class="icon-btn" onclick="location.href='list.html'">☰</button>
    </div>
  </div>

  <div class="container">
    <div class="title-area">
      <h1 class="work-title" id="work-title">--</h1>
      <hr class="title-divider">
      <div class="meta-info">
        <span id="work-date">--</span>
        <span id="work-length">--</span>
      </div>
    </div>

    <div class="genre-label" id="work-genre">--</div>
    <div class="btn-group" id="btn-group"></div>
  </div>

  <!-- 検索モーダル -->
  <div id="search-modal">
    <div class="search-box">
      <input type="text" id="search-input" class="search-input" placeholder="作品名やジャンルで検索..." oninput="execSearch()">
      <ul class="search-results" id="search-results"></ul>
      <button onclick="closeSearch()" style="margin-top:10px; width:100%; padding:8px;">閉じる</button>
    </div>
  </div>

  <script src="data.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const workId = urlParams.get('id') || worksData[0].id;
    const work = worksData.find(w => w.id === workId);

    if (work) {
      document.title = `${work.title}｜北風小僧`;
      document.getElementById('work-title').innerText = work.title;
      document.getElementById('work-date').innerText = work.date;
      document.getElementById('work-length').innerText = work.length;
      document.getElementById('work-genre').innerText = work.genre;

      const savedBookmark = localStorage.getItem(`bookmark_${workId}`);
      const btnGroup = document.getElementById('btn-group');

      if (savedBookmark) {
        btnGroup.innerHTML = `
          <a href="novel-reader.html?id=${workId}&page=${savedBookmark}" class="read-btn primary">続きから読む (P.${savedBookmark})</a>
          <a href="novel-reader.html?id=${workId}&page=1" class="read-btn">最初から読む</a>
        `;
      } else {
        btnGroup.innerHTML = `
          <a href="novel-reader.html?id=${workId}&page=1" class="read-btn">読む</a>
        `;
      }
    }

    // 検索機能の制御
    function openSearch() { document.getElementById('search-modal').style.display = 'flex'; }
    function closeSearch() { document.getElementById('search-modal').style.display = 'none'; }
    function execSearch() {
      const q = document.getElementById('search-input').value.toLowerCase();
      const res = document.getElementById('search-results');
      res.innerHTML = '';
      if(!q) return;
      worksData.filter(w => w.title.toLowerCase().includes(q) || w.genre.includes(q)).forEach(w => {
        const url = w.type === 'novel' ? `novel-cover.html?id=${w.id}` : `detail.html?id=${w.id}`;
        res.innerHTML += `<li><a href="${url}">${w.title} (${w.genre})</a></li>`;
      });
    }
  </script>
</body>
</html>
