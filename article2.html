<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>恐怖の構造｜北風小僧</title>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-color: #fcfbf9;
      --text-color: #2b2b2b;
      --border-color: #e0e0e0;
      --genre-color: #2b5b84; 
    }

    body {
      font-family: 'Shippori Mincho', "Yu Mincho", serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.8;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* --- トップページと共通のヘッダー --- */
    .site-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-color);
      background-color: #ffffff;
      font-family: 'Shippori Mincho', serif;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .site-title-a {
      font-size: 1.25rem;
      font-weight: bold;
      letter-spacing: 0.05em;
      color: var(--text-color);
      text-decoration: none;
    }
    .header-icons {
      display: flex;
      gap: 16px;
      font-size: 1.2rem;
    }
    .icon-btn {
      background: none;
      border: none;
      font-size: 1.2rem;
      cursor: pointer;
      color: var(--text-color);
    }

    /* 記事メインエリア */
    .article-container {
      max-width: 680px;
      width: 100%;
      margin: 0 auto;
      padding: 36px 20px 40px; /* 上部余白を広げてゆとりを持たせる */
      flex: 1;
    }

    /* タイトルエリア */
    .article-header {
      margin-bottom: 24px;
    }
    .title-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }
    .article-title {
      font-size: 1.8rem;
      font-weight: bold;
      line-height: 1.3;
      letter-spacing: 0.05em;
      display: inline-block;
    }
    .share-btn {
      background: none;
      border: none;
      font-size: 1.3rem;
      cursor: pointer;
      padding: 4px;
      color: #666;
    }

    /* タイトル文字列の長さに合わせたカラーライン */
    .genre-line-wrap {
      margin-top: 8px;
      margin-bottom: 6px;
    }
    .genre-line {
      height: 3px;
      background-color: var(--genre-color);
      display: inline-block;
      min-width: 3em; /* 最低保証幅 */
      border-radius: 2px;
    }

    /* メタ情報（著者、更新日、文字数） */
    .meta-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      font-size: 0.95rem;
      color: #333;
      font-family: 'Shippori Mincho', serif; /* 明朝体に統一 */
      margin-top: 4px;
    }
    .author-name {
      font-weight: 500;
      font-size: 1rem;
    }
    .meta-right {
      text-align: right;
      line-height: 1.4;
      font-size: 0.88rem;
      color: #555;
    }

    /* 本文エリア */
    .article-body {
      font-size: 1.05rem;
      letter-spacing: 0.03em;
      margin-top: 32px;
      margin-bottom: 40px;
      word-break: break-word;
    }

    /* 段落の改行調整 */
    .article-body p {
      margin-bottom: 1.6em;
      text-indent: 1em;
    }
    .article-body p.no-indent {
      text-indent: 0;
    }

    /* セクション区切り線 */
    .divider {
      text-align: center;
      margin: 40px 0;
      color: #ccc;
      letter-spacing: 0.5em;
    }

    /* コメントコーナー */
    .comment-section {
      border-top: 1px solid var(--border-color);
      padding-top: 24px;
      font-family: 'Noto Sans JP', sans-serif;
    }

    .comment-toggle-btn {
      width: 100%;
      padding: 12px 16px;
      background-color: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 24px;
      font-size: 0.95rem;
      font-weight: 500;
      color: #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .comment-toggle-btn:hover {
      background-color: #f0f0f0;
    }

    .comment-content {
      display: none;
      margin-top: 16px;
      padding: 16px;
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 12px;
    }
    .comment-content.open {
      display: block;
    }

    .comment-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }
    .comment-input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.9rem;
      resize: vertical;
      min-height: 70px;
    }
    .comment-submit-btn {
      align-self: flex-end;
      padding: 6px 16px;
      background-color: #333;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .comment-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .comment-item {
      padding: 10px 12px;
      background-color: #f9f9f9;
      border-radius: 6px;
      font-size: 0.88rem;
    }
    .comment-meta {
      font-size: 0.75rem;
      color: #888;
      margin-bottom: 4px;
    }

    /* --- トップページと共通のフッター --- */
    .site-footer {
      border-top: 1px solid var(--border-color);
      background-color: #ffffff;
      padding: 24px 20px;
      text-align: center;
      font-size: 0.8rem;
      color: #777;
      font-family: 'Noto Sans JP', sans-serif;
      margin-top: auto;
    }
  </style>
</head>
<body>

  <!-- トップページ共通ヘッダー -->
  <header class="site-header">
    <a href="index.html" class="site-title-a">北風小僧</a>
    <div class="header-icons">
      <button class="icon-btn" title="検索">🔍</button>
      <button class="icon-btn" title="メニュー">☰</button>
    </div>
  </header>

  <!-- 記事メイン -->
  <main class="article-container">
    
    <article class="article-header">
      <!-- タイトル & 共有ボタン -->
      <div class="title-row">
        <h1 class="article-title" id="article-title">恐怖の構造</h1>
        <button class="share-btn" onclick="shareArticle()" title="共有">⋮</button>
      </div>

      <!-- タイトルの文字数に連動するカラーライン -->
      <div class="genre-line-wrap">
        <div class="genre-line" id="genre-line"></div>
      </div>

      <!-- メタ情報（更新日・文字数を入れ替え＆明朝体へ） -->
      <div class="meta-row">
        <div class="author-name">北風小僧</div>
        <div class="meta-right">
          <div id="update-date">2026.08.21</div>
          <div id="char-count">0文字</div>
        </div>
      </div>
    </article>

    <!-- ===================================================
         【本文を打つ場所】ここから下へ本文を入力してください
         =================================================== -->
    <div class="article-body" id="article-body">

      <p>ここに評論や随筆の本文を記述します。改行は &lt;p&gt; タグで囲むことで段落分けが行われ、読みやすい余白と一文字下げが適用されます。</p>

      <p>長い文章であっても横書きでスムーズにスクロールして読むことができます。改行を多く使いたい場合や、詩的な表現でインデント（一文字下げ）を無くしたい場合は、&lt;p class="no-indent"&gt; を使用することも可能です。</p>

      <p>見出しや特定の強調表現を使いたい場合も、シンプルな横書きフォーマットのため柔軟に対応できます。</p>

    </div>
    <!-- ===================================================
         【本文を打つ場所】ここまで
         =================================================== -->

    <div class="divider">〜〜〜</div>

    <!-- コメントコーナー（サクラ削除済み） -->
    <section class="comment-section">
      <button class="comment-toggle-btn" onclick="toggleComments()">
        <span>💬 コメント...</span>
        <span id="toggle-icon">開く ▼</span>
      </button>

      <div class="comment-content" id="comment-content">
        <!-- 投稿フォーム -->
        <div class="comment-form">
          <textarea class="comment-input" id="comment-input" placeholder="匿名でコメントを残す..."></textarea>
          <button class="comment-submit-btn" onclick="addComment()">送信</button>
        </div>

        <!-- コメント一覧（初期表示は空） -->
        <div class="comment-list" id="comment-list"></div>
      </div>
    </section>

  </main>

  <!-- トップページ共通フッター -->
  <footer class="site-footer">
    <p>&copy; 北風小僧 All Rights Reserved.</p>
  </footer>

  <script src="data.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const articleId = params.get('id') || 'article2';
    const currentArticle = typeof allArticles !== 'undefined' ? allArticles.find(item => item.id === articleId) : null;

    const bodyEl = document.getElementById('article-body');
    const titleEl = document.getElementById('article-title');
    const genreLine = document.getElementById('genre-line');

    // カラーラインの長さをタイトルの文字幅に合わせる
    function adjustLineLength() {
      const titleWidth = titleEl.offsetWidth;
      genreLine.style.width = `${titleWidth}px`;
    }

    // 本文のみの文字数を自動カウント
    function updateCharCount() {
      const fullText = bodyEl.innerText.replace(/\s+/g, '');
      const count = fullText.length;
      document.getElementById('char-count').innerText = count.toLocaleString() + '文字';
      
      localStorage.setItem(`charCount_${articleId}`, count);
    }

    // データファイル(data.js)との連動
    if (currentArticle) {
      document.title = `${currentArticle.title}｜北風小僧`;
      titleEl.innerText = currentArticle.title;
      document.getElementById('update-date').innerText = currentArticle.date;

      const genreColorMap = {
        "blue": "#2b5b84",
        "green": "#3b7a57",
        "red": "#9e3d3d"
      };
      if (genreColorMap[currentArticle.genre]) {
        genreLine.style.backgroundColor = genreColorMap[currentArticle.genre];
      }
    }

    // 共有機能
    function shareArticle() {
      if (navigator.share) {
        navigator.share({
          title: document.title,
          url: window.location.href
        }).catch(() => {});
      } else {
        navigator.clipboard.writeText(window.location.href);
        alert('記事のURLをコピーしました！');
      }
    }

    // コメント開閉
    function toggleComments() {
      const content = document.getElementById('comment-content');
      const icon = document.getElementById('toggle-icon');
      
      content.classList.toggle('open');
      if (content.classList.contains('open')) {
        icon.innerText = '閉じる ▲';
      } else {
        icon.innerText = '開く ▼';
      }
    }

    // 匿名コメント追加
    function addComment() {
      const input = document.getElementById('comment-input');
      const text = input.value.trim();
      if (!text) return;

      const list = document.getElementById('comment-list');
      const now = new Date();
      const timeStr = `${now.getFullYear()}/${now.getMonth()+1}/${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;

      const item = document.createElement('div');
      item.className = 'comment-item';
      item.innerHTML = `
        <div class="comment-meta">匿名さん ・ ${timeStr}</div>
        <div>${text.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</div>
      `;

      list.prepend(item);
      input.value = '';
    }

    window.onload = () => {
      adjustLineLength();
      updateCharCount();
    };
  </script>
</body>
</html>
