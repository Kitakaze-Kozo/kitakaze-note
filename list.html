<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作品一覧 - 北風小僧</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Shippori+Mincho:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Shippori Mincho', "Yu Mincho", "MS PMincho", serif;
      background-color: #ffffff;
      color: #111111;
      line-height: 1.9;
      -webkit-font-smoothing: antialiased;
    }

    #top-color-bar { height: 5px; width: 100%; }

    /* ナビゲーションバー */
    .top-nav {
      position: sticky; top: 0; background: rgba(255, 255, 255, 0.98); z-index: 1000;
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 24px; border-bottom: 1px solid #111111;
    }
    .brand-logo {
      font-size: 1.75rem; font-weight: 800; text-decoration: none; color: #000;
      letter-spacing: 0.18em; text-transform: uppercase; text-shadow: 0.5px 0 0 #000;
    }
    .nav-right { display: flex; align-items: center; gap: 20px; }
    .menu-btn { background: none; border: none; cursor: pointer; font-size: 1.65rem; color: #111; padding: 2px; }

    /* 全画面メニュー */
    #overlay-menu {
      position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
      background-color: rgba(10, 10, 10, 0.96); color: #fff;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 10000; opacity: 0; visibility: hidden; transition: opacity 0.3s, visibility 0.3s;
    }
    #overlay-menu.active { opacity: 1; visibility: visible; }
    .close-btn { position: absolute; top: 24px; right: 28px; font-size: 2.2rem; color: #fff; background: none; border: none; cursor: pointer; }
    .menu-list { list-style: none; text-align: center; }
    .menu-list li { margin: 24px 0; }
    .menu-list a { color: #fff; text-decoration: none; font-size: 1.25rem; letter-spacing: 0.15em; }

    .container { max-width: 680px; margin: 0 auto; padding: 30px 24px 60px; }

    .page-title { font-size: 1.4rem; font-weight: 800; border-bottom: 2px solid #111; padding-bottom: 8px; margin-bottom: 25px; letter-spacing: 0.1em; }

    /* フィルタボタン群 */
    .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 30px; }
    .filter-btn {
      border: 1px solid #ddd; background: #f9f9f9; padding: 6px 14px; font-size: 0.82rem;
      cursor: pointer; font-family: inherit; font-weight: 600; border-radius: 0px;
    }
    .filter-btn.active { border-color: #111; background: #111; color: #fff; }

    /* 作品カード */
    .article-card {
      border: 1px solid #e0e0e0; padding: 22px 20px 16px; margin-bottom: 18px;
      text-decoration: none; color: inherit; display: block; background: #fff;
      transition: border-color 0.2s;
    }
    .article-card:hover { border-color: #111; }
    .card-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 12px; display: inline-block; }

    .card-meta-row {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 0.8rem; color: #888; border-top: 1px dashed #eee; padding-top: 10px; margin-top: 10px;
    }

    .share-btn {
      background: none; border: none; cursor: pointer; font-size: 1.1rem; color: #666;
      padding: 2px 6px; border-radius: 4px; line-height: 1;
    }
    .share-btn:hover { background-color: #f0f0f0; color: #000; }

    .line-blue   { border-bottom: 3px solid #4ba3e3; padding-bottom: 2px; }
    .line-green  { border-bottom: 3px solid #3cb878; padding-bottom: 2px; }
    .line-red    { border-bottom: 3px solid #f06292; padding-bottom: 2px; }
    .line-yellow { border-bottom: 3px solid #f6d155; padding-bottom: 2px; }

    /* フッター黒エリア */
    .footer-dark-section {
      background-color: #111111; color: #ffffff; width: 100%; padding: 50px 24px 40px; margin-top: 60px;
    }
    .footer-dark-inner { max-width: 680px; margin: 0 auto; text-align: center; }
    .contact-info-box { margin-bottom: 30px; padding-bottom: 25px; border-bottom: 1px dashed #333; font-size: 0.88rem; color: #ccc; line-height: 2.2; }
    .contact-info-box a { color: #fff; text-decoration: underline; }
    .footer-links { list-style: none; text-align: center; font-size: 0.88rem; line-height: 2.5; margin-bottom: 35px; }
    .footer-links a { color: #ccc; text-decoration: none; }
    .dark-copyright { text-align: center; font-size: 0.82rem; color: #777; border-top: 1px solid #222; padding-top: 25px; }
  </style>
</head>
<body>

  <div id="top-color-bar" style="background-color: #5baed7;"></div>

  <div class="top-nav">
    <a href="index.html" class="brand-logo">北風小僧</a>
    <div class="nav-right">
      <button class="menu-btn" onclick="toggleMenu()">☰</button>
    </div>
  </div>

  <div id="overlay-menu">
    <button class="close-btn" onclick="toggleMenu()">✕</button>
    <ul class="menu-list">
      <li><a href="list.html">作品一覧</a></li>
      <li><a href="about.html">私について</a></li>
      <li><a href="contact.html">お問い合わせ</a></li>
      <li><a href="contact.html">感想を送る</a></li>
    </ul>
  </div>

  <div class="container">
    <h1 class="page-title">作品一覧</h1>

    <div class="filter-bar">
      <button class="filter-btn active" onclick="filterGenre('all', this)">すべて</button>
      <button class="filter-btn" onclick="filterGenre('blue', this)">評論風</button>
      <button class="filter-btn" onclick="filterGenre('green', this)">随筆</button>
      <button class="filter-btn" onclick="filterGenre('red', this)">小説</button>
      <button class="filter-btn" onclick="filterGenre('yellow', this)">詩歌</button>
    </div>

    <div id="articles-list">
      <!-- JavaScriptで描画 -->
    </div>
  </div>

  <div class="footer-dark-section">
    <div class="footer-dark-inner">
      <div class="contact-info-box">
        <p>Gmail: <a href="mailto:xxx@gmail.com">xxx@gmail.com</a></p>
        <p>Twitter (X): <a href="https://twitter.com/xxx" target="_blank" rel="noopener">@xxx</a></p>
      </div>
      <ul class="footer-links">
        <li><a href="about.html">私について</a></li>
        <li><a href="terms.html">サイトのご利用について</a></li>
        <li><a href="help.html">ヘルプ</a></li>
        <li><a href="contact.html">お問い合わせ</a></li>
      </ul>
      <div class="dark-copyright">&copy; 北風小僧</div>
    </div>
  </div>

  <script>
    const articles = [
      { id: 5, title: "作品タイトル5", url: "article5.html", date: "2026.08.27", length: "約1,500字", colorClass: "line-blue", genre: "blue" },
      { id: 4, title: "作品タイトル4", url: "article4.html", date: "2026.08.26", length: "約1,000字", colorClass: "line-red", genre: "red" },
      { id: 2, title: "恐怖の構造", url: "article2.html", date: "2026.08.26", length: "約1,200字", colorClass: "line-blue", genre: "blue" },
      { id: "h", title: "はじめに", url: "hajimene.html", date: "2026.08.21", length: "約300字", colorClass: "line-green", genre: "green" },
      { id: 1, title: "旧作品1", url: "article1.html", date: "2026.07.29", length: "約2,000字", colorClass: "line-yellow", genre: "yellow" },
      { id: 0, title: "旧作品2", url: "article0.html", date: "2026.07.15", length: "約800字", colorClass: "line-green", genre: "green" }
    ];

    function shareArticle(event, title, url) {
      event.preventDefault();
      event.stopPropagation();
      if (navigator.share) {
        navigator.share({ title: title, url: url }).catch(() => {});
      } else {
        navigator.clipboard.writeText(window.location.origin + '/' + url);
        alert('作品リンクをクリップボードにコピーしました');
      }
    }

    function renderArticles(filter = 'all') {
      const container = document.getElementById('articles-list');
      container.innerHTML = '';
      
      const filtered = filter === 'all' 
        ? articles 
        : articles.filter(a => a.genre === filter);

      filtered.forEach(item => {
        container.innerHTML += `
          <a href="${item.url}" class="article-card">
            <span class="card-title"><span class="${item.colorClass}">${item.title}</span></span>
            <div class="card-meta-row">
              <span>${item.date}｜${item.length}</span>
              <button class="share-btn" onclick="shareArticle(event, '${item.title}', '${item.url}')">…</button>
            </div>
          </a>
        `;
      });
    }

    function filterGenre(genre, btn) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderArticles(genre);
    }

    /* URLクエリパラメータ(?genre=blue等)の読み込み処理 */
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const genreParam = params.get('genre');
      if (genreParam) {
        const targetBtn = document.querySelector(`.filter-btn[onclick*="'${genreParam}'"]`);
        if (targetBtn) {
          filterGenre(genreParam, targetBtn);
          return;
        }
      }
      renderArticles('all');
    });

    function toggleMenu() {
      document.getElementById('overlay-menu').classList.toggle('active');
    }
  </script>
</body>
</html>
