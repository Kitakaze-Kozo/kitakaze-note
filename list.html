<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作品一覧｜北風小僧</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Shippori+Mincho:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Shippori Mincho', "Yu Mincho", "MS PMincho", serif;
      background-color: #ffffff;
      color: #111111;
      line-height: 1.9;
      -webkit-font-smoothing: antialiased;
    }

    .top-nav {
      position: sticky; top: 0; background: rgba(255, 255, 255, 0.98); z-index: 1000;
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 24px; border-bottom: 1px solid #111111;
      backdrop-filter: blur(5px);
    }
    
    .brand-logo {
      font-size: 1.5rem; font-weight: 800; text-decoration: none; color: #000;
      letter-spacing: 0.18em; text-transform: uppercase;
      text-shadow: 0.5px 0 0 #000;
    }

    .nav-right { display: flex; align-items: center; gap: 20px; }
    
    .search-btn { background: none; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 4px; }
    .search-btn svg { width: 18px; height: 18px; stroke: #111; stroke-width: 2.2; fill: none; }

    .menu-btn { background: none; border: none; cursor: pointer; font-size: 1.65rem; color: #111; line-height: 1; padding: 2px; }

    #overlay-menu {
      position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
      background-color: rgba(10, 10, 10, 0.96); color: #fff;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 10000; opacity: 0; visibility: hidden; transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    #overlay-menu.active { opacity: 1; visibility: visible; }
    .close-btn { position: absolute; top: 24px; right: 28px; font-size: 2.2rem; color: #fff; background: none; border: none; cursor: pointer; }
    .menu-list { list-style: none; text-align: center; }
    .menu-list li { margin: 24px 0; }
    .menu-list a { color: #fff; text-decoration: none; font-size: 1.25rem; letter-spacing: 0.15em; }

    .container { max-width: 680px; margin: 0 auto; padding: 30px 24px 50px; }

    .page-title {
      font-size: 1.4rem; font-weight: 700; letter-spacing: 0.08em;
      margin-bottom: 20px;
    }

    .thin-divider {
      border: 0;
      border-top: 1px solid #e0e0e0;
      margin-left: -24px;
      margin-right: -24px;
    }

    .control-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 0;
      font-size: 0.9rem;
    }
    .sort-controls { display: flex; align-items: center; gap: 8px; }
    .select-box {
      border: none; background: none; font-family: inherit; font-size: 0.9rem;
      font-weight: bold; cursor: pointer; outline: none; color: #111111;
    }
    .order-btn {
      background: none; border: 1px solid #111111; border-radius: 2px;
      padding: 2px 8px; cursor: pointer; font-size: 0.8rem; color: #111111;
      font-family: inherit;
    }

    .filter-btn {
      background: none; border: none; font-family: inherit; font-size: 0.9rem;
      font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 6px;
      color: #111111;
    }
    .filter-icon { font-size: 1rem; line-height: 1; }

    .line-blue   { border-bottom: 2px solid #4ba3e3; padding-bottom: 2px; }
    .line-green  { border-bottom: 2px solid #3cb878; padding-bottom: 2px; }
    .line-red    { border-bottom: 2px solid #f06292; padding-bottom: 2px; }
    .line-yellow { border-bottom: 2px solid #f6d155; padding-bottom: 2px; }

    .article-list { list-style: none; margin-bottom: 30px; }
    .article-item {
      padding: 16px 0; border-bottom: 1px dashed #e0e0e0; text-decoration: none;
      color: inherit; display: block;
    }
    .article-item:hover { opacity: 0.8; }
    .article-title-wrap { margin-bottom: 8px; }
    .article-title { font-weight: 700; font-size: 1.05rem; }
    
    .article-meta-row {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 0.82rem; color: #666;
    }

    .meta-info-group {
      display: flex; gap: 12px; align-items: center;
    }

    .share-btn {
      background: none; border: none; cursor: pointer; font-size: 1.1rem; color: #666;
      padding: 0 4px; line-height: 1; font-family: inherit;
    }
    .share-btn:hover { color: #000; }

    .pagination {
      display: flex; justify-content: center; align-items: center; gap: 12px;
      margin: 35px 0 25px; font-size: 1rem;
    }
    .page-num {
      text-decoration: none; color: #111; padding: 2px 8px; cursor: pointer;
    }
    .page-num.active {
      border: 1px solid #111; font-weight: bold;
    }

    .page-search-box {
      display: flex; justify-content: center; align-items: center; gap: 10px;
      margin-bottom: 40px; font-size: 0.88rem;
    }
    .page-input {
      width: 60px; padding: 4px 8px; text-align: center;
      border: 1px solid #ccc; font-family: inherit; font-size: 0.88rem;
    }
    .page-submit-btn {
      background: none; border: 1px solid #111; padding: 4px 10px;
      cursor: pointer; font-family: inherit; font-size: 0.85rem; color: #111;
    }

    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
      background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center;
      z-index: 10000; opacity: 0; visibility: hidden; transition: opacity 0.2s;
    }
    .modal-overlay.active { opacity: 1; visibility: visible; }
    .modal-content {
      background: #fff; width: 85%; max-width: 360px; padding: 25px; border-radius: 0px;
      border: 1px solid #111;
    }
    .modal-title { font-size: 1rem; font-weight: bold; margin-bottom: 15px; border-bottom: 1px solid #111; padding-bottom: 8px; color: #111; }
    .color-filter-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .color-filter-item {
      padding: 12px 16px; cursor: pointer; font-size: 0.92rem; font-weight: 500;
      display: flex; justify-content: space-between; align-items: center; color: #000000;
      user-select: none;
    }
    .color-filter-item label {
      display: flex; justify-content: space-between; align-items: center; width: 100%; cursor: pointer;
    }
    .color-filter-item input[type="checkbox"] {
      margin-right: 10px; transform: scale(1.2); cursor: pointer;
    }

    .modal-submit-btn {
      display: block; width: 100%; border: 1px solid #111; background: #111; color: #fff;
      padding: 10px; margin-top: 18px; font-family: inherit; font-size: 0.9rem; font-weight: bold;
      cursor: pointer; text-align: center;
    }
    .modal-submit-btn:hover {
      background: #333;
    }

    .footer-dark-section {
      background-color: #111111;
      color: #ffffff;
      width: 100%;
      padding: 50px 24px 40px;
      margin-top: 60px;
    }
    .footer-dark-inner {
      max-width: 680px;
      margin: 0 auto;
      text-align: center;
    }

    .contact-info-box {
      margin-bottom: 30px;
      padding-bottom: 25px;
      border-bottom: 1px dashed #333333;
      font-size: 0.88rem;
      color: #cccccc;
      line-height: 2.2;
    }
    .contact-info-box a { color: #ffffff; text-decoration: underline; }

    .footer-links { list-style: none; text-align: center; font-size: 0.88rem; line-height: 2.5; margin-bottom: 35px; }
    .footer-links a { color: #cccccc; text-decoration: none; transition: color 0.2s; }
    .footer-links a:hover { color: #ffffff; }
    
    .dark-copyright { text-align: center; font-size: 0.82rem; color: #777777; border-top: 1px solid #222222; padding-top: 25px; }

    #search-modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
      background: rgba(10, 10, 10, 0.95); z-index: 20000; display: none;
      align-items: center; justify-content: center; padding: 20px; color: #fff;
    }
    #search-modal.active { display: flex; }
    .search-box { width: 100%; max-width: 500px; }
    .search-input {
      width: 100%; padding: 14px; font-size: 1.1rem; background: #222; border: 1px solid #444;
      color: #fff; font-family: inherit; outline: none; margin-bottom: 20px;
    }
    .search-results { list-style: none; max-height: 300px; overflow-y: auto; text-align: left; }
    .search-results li { border-bottom: 1px solid #333; padding: 12px 0; }
    .search-results a { text-decoration: none; color: #fff; display: block; }
    .search-close-btn { background: none; border: 1px solid #fff; color: #fff; padding: 10px 20px; margin-top: 20px; cursor: pointer; width: 100%; font-family: inherit; }
  </style>
</head>
<body>

  <div class="top-nav">
    <a href="index.html" class="brand-logo">北風小僧</a>
    <div class="nav-right">
      <button class="search-btn" title="検索" onclick="toggleSearch()">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16" y1="16" x2="21" y2="21"/></svg>
      </button>
      <button class="menu-btn" onclick="toggleMenu()">☰</button>
    </div>
  </div>

  <div id="overlay-menu">
    <button class="close-btn" onclick="toggleMenu()">✕</button>
    <ul class="menu-list">
      <li><a href="list.html">作品一覧</a></li>
      <li><a href="about.html">私について</a></li>
      <li><a href="contact.html">お問い合わせ</a></li>
      <li><a href="contact.html">感想を送る</a></li>
    </ul>
  </div>

  <div id="search-modal">
    <div class="search-box">
      <input type="text" id="search-input" class="search-input" placeholder="作品名やキーワードを入力..." oninput="execSearch()">
      <ul class="search-results" id="search-results"></ul>
      <button class="search-close-btn" onclick="toggleSearch()">閉じる</button>
    </div>
  </div>

  <div class="container">
    <h1 class="page-title">作品一覧</h1>
    <hr class="thin-divider">

    <div class="control-bar">
      <div class="sort-controls">
        <select id="sort-select" class="select-box" onchange="changeSort()">
          <option value="date">新着順</option>
          <option value="popular">人気順</option>
        </select>
        <button id="order-toggle-btn" class="order-btn" onclick="toggleOrder()">↓ 降順</button>
      </div>

      <button class="filter-btn" onclick="openFilterModal()">
        絞り込み <span class="filter-icon">⏚</span>
      </button>
    </div>

    <hr class="thin-divider" style="margin-bottom: 15px;">

    <div class="article-list" id="article-list-container"></div>
    <div class="pagination" id="pagination-container"></div>

    <div class="page-search-box">
      <span>ページ検索</span>
      <input type="number" id="page-input" class="page-input" min="1">
      <button class="page-submit-btn" onclick="jumpToPage()">移動</button>
    </div>
  </div>

  <div class="modal-overlay" id="filter-modal" onclick="closeFilterModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-title">ジャンル絞り込み</div>
      <ul class="color-filter-list">
        <li class="color-filter-item" style="background:#f4f4f4;">
          <label>
            <div>
              <input type="checkbox" value="all" id="chk-all" onchange="toggleAllCheck(this)">
              <span>すべて表示</span>
            </div>
            <span id="modal-count-all"></span>
          </label>
        </li>
        <li class="color-filter-item" style="background:#5baed7;">
          <label>
            <div>
              <input type="checkbox" name="genre-chk" value="blue" onchange="toggleGenreCheck()">
              <span>評論風</span>
            </div>
            <span id="modal-count-blue"></span>
          </label>
        </li>
        <li class="color-filter-item" style="background:#52be80;">
          <label>
            <div>
              <input type="checkbox" name="genre-chk" value="green" onchange="toggleGenreCheck()">
              <span>随筆</span>
            </div>
            <span id="modal-count-green"></span>
          </label>
        </li>
        <li class="color-filter-item" style="background:#f1789a;">
          <label>
            <div>
              <input type="checkbox" name="genre-chk" value="red" onchange="toggleGenreCheck()">
              <span>小説</span>
            </div>
            <span id="modal-count-red"></span>
          </label>
        </li>
        <li class="color-filter-item" style="background:#f7d358;">
          <label>
            <div>
              <input type="checkbox" name="genre-chk" value="yellow" onchange="toggleGenreCheck()">
              <span>詩歌</span>
            </div>
            <span id="modal-count-yellow"></span>
          </label>
        </li>
      </ul>
      <button class="modal-submit-btn" onclick="applyColorFilter()">適用する</button>
    </div>
  </div>

  <div class="footer-dark-section">
    <div class="footer-dark-inner">
      <div class="contact-info-box">
        <p>Gmail: <a href="mailto:xxx@gmail.com">xxx@gmail.com</a></p>
        <p>Twitter (X): <a href="https://twitter.com/xxx" target="_blank" rel="noopener">@xxx</a></p>
      </div>
      <ul class="footer-links">
        <li><a href="about.html">私について</a></li>
        <li><a href="terms.html">サイトのご利用について</a></li>
        <li><a href="help.html">ヘルプ</a></li>
        <li><a href="contact.html">お問い合わせ</a></li>
      </ul>
      <div class="dark-copyright">&copy; 北風小僧</div>
    </div>
  </div>

  <script src="data.js"></script>
  <script>
    let currentPage = 1;
    const itemsPerPage = 10;
    let currentSort = "date";
    let isDescending = true;
    let selectedGenres = ["all"];

    function initParams() {
      const params = new URLSearchParams(window.location.search);
      if (params.get('sort') === 'popular') {
        currentSort = 'popular';
        document.getElementById('sort-select').value = 'popular';
      }
      const genreParam = params.get('genre');
      if (genreParam) selectedGenres = [genreParam];
      syncCheckboxesWithState();
    }

    function syncCheckboxesWithState() {
      const chkAll = document.getElementById('chk-all');
      const genreChks = document.querySelectorAll('input[name="genre-chk"]');
      if (selectedGenres.includes("all") || selectedGenres.length === 0) {
        chkAll.checked = true;
        genreChks.forEach(chk => chk.checked = false);
      } else {
        chkAll.checked = false;
        genreChks.forEach(chk => chk.checked = selectedGenres.includes(chk.value));
      }
    }

    function toggleAllCheck(allInput) {
      if (allInput.checked) {
        document.querySelectorAll('input[name="genre-chk"]').forEach(chk => chk.checked = false);
      }
    }

    function toggleGenreCheck() {
      const genreChks = document.querySelectorAll('input[name="genre-chk"]:checked');
      document.getElementById('chk-all').checked = (genreChks.length === 0);
    }

    function updateModalCounts() {
      const counts = { all: allArticles.length, blue: 0, green: 0, red: 0, yellow: 0 };
      allArticles.forEach(item => {
        if (counts.hasOwnProperty(item.genre)) counts[item.genre]++;
      });
      document.getElementById('modal-count-all').innerText = `(${counts.all})`;
      document.getElementById('modal-count-blue').innerText = `(${counts.blue})`;
      document.getElementById('modal-count-green').innerText = `(${counts.green})`;
      document.getElementById('modal-count-red').innerText = `(${counts.red})`;
      document.getElementById('modal-count-yellow').innerText = `(${counts.yellow})`;
    }

    function getProcessedArticles() {
      let list = [...allArticles];
      if (!selectedGenres.includes("all") && selectedGenres.length > 0) {
        list = list.filter(item => selectedGenres.includes(item.genre));
      }
      list.sort((a, b) => {
        let valA = currentSort === "date" ? new Date(a.date.replace(/\./g, '/')) : a.popularRank;
        let valB = currentSort === "date" ? new Date(b.date.replace(/\./g, '/')) : b.popularRank;
        if (isDescending) return currentSort === "date" ? valB - valA : valA - valB;
        else return currentSort === "date" ? valA - valB : valB - valA;
      });
      return list;
    }

    function shareArticle(event, title, url) {
      event.preventDefault();
      event.stopPropagation();
      if (navigator.share) navigator.share({ title: title, url: url }).catch(() => {});
      else {
        navigator.clipboard.writeText(window.location.origin + '/' + url);
        alert('作品リンクをクリップボードにコピーしました');
      }
    }

    function render() {
      const articles = getProcessedArticles();
      const totalPages = Math.ceil(articles.length / itemsPerPage) || 1;

      if (currentPage > totalPages) currentPage = totalPages;
      if (currentPage < 1) currentPage = 1;

      const container = document.getElementById('article-list-container');
      container.innerHTML = '';

      const start = (currentPage - 1) * itemsPerPage;
      const pageArticles = articles.slice(start, start + itemsPerPage);

      if (pageArticles.length === 0) {
        container.innerHTML = '<p style="text-align:center; padding: 40px 0; color:#888;">該当する作品がありません。</p>';
      } else {
        pageArticles.forEach(item => {
          container.innerHTML += `
            <a href="${item.url}" class="article-item">
              <div class="article-title-wrap">
                <span class="article-title"><span class="line-${item.genre}">${item.title}</span></span>
              </div>
              <div class="article-meta-row">
                <span>${item.date}</span>
                <div class="meta-info-group">
                  <span>${item.length}</span>
                  <button class="share-btn" onclick="shareArticle(event, '${item.title}', '${item.url}')">…</button>
                </div>
              </div>
            </a>
          `;
        });
      }

      const pagination = document.getElementById('pagination-container');
      pagination.innerHTML = '';
      for (let i = 1; i <= totalPages; i++) {
        pagination.innerHTML += `<span class="page-num ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</span>`;
      }
    }

    function changeSort() {
      currentSort = document.getElementById('sort-select').value;
      currentPage = 1;
      render();
    }

    function toggleOrder() {
      isDescending = !isDescending;
      document.getElementById('order-toggle-btn').innerText = isDescending ? "↓ 降順" : "↑ 昇順";
      currentPage = 1;
      render();
    }

    function goToPage(page) {
      currentPage = page;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function jumpToPage() {
      const input = document.getElementById('page-input').value;
      if (input) goToPage(parseInt(input, 10));
    }

    function openFilterModal() {
      syncCheckboxesWithState();
      document.getElementById('filter-modal').classList.add('active');
    }
    function closeFilterModal(e) {
      document.getElementById('filter-modal').classList.remove('active');
    }

    function applyColorFilter() {
      const chkAll = document.getElementById('chk-all');
      const genreChks = document.querySelectorAll('input[name="genre-chk"]:checked');
      if (chkAll.checked || genreChks.length === 0) selectedGenres = ["all"];
      else selectedGenres = Array.from(genreChks).map(chk => chk.value);
      closeFilterModal();
      currentPage = 1;
      render();
    }

    function toggleMenu() {
      document.getElementById('overlay-menu').classList.toggle('active');
    }

    function toggleSearch() {
      const modal = document.getElementById('search-modal');
      modal.classList.toggle('active');
      if (modal.classList.contains('active')) document.getElementById('search-input').focus();
    }

    function execSearch() {
      const query = document.getElementById('search-input').value.toLowerCase().trim();
      const resultsContainer = document.getElementById('search-results');
      resultsContainer.innerHTML = '';
      if (!query) return;

      const filtered = allArticles.filter(item => 
        item.title.toLowerCase().includes(query) || 
        (genreNames[item.genre] && genreNames[item.genre].includes(query))
      );

      if (filtered.length === 0) {
        resultsContainer.innerHTML = '<li style="color:#aaa;">該当する作品が見つかりません</li>';
        return;
      }

      filtered.forEach(item => {
        resultsContainer.innerHTML += `
          <li>
            <a href="${item.url}">
              <strong>${item.title}</strong>
              <div style="font-size:0.8rem; color:#888;">${item.date}｜${genreNames[item.genre]}｜${item.length}</div>
            </a>
          </li>
        `;
      });
    }

    initParams();
    updateModalCounts();
    render();
  </script>
</body>
</html>
