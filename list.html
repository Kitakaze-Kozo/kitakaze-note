<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作品一覧｜北風小僧</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Shippori+Mincho:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Shippori Mincho', "Yu Mincho", "MS PMincho", serif;
      background-color: #ffffff;
      color: #111111;
      line-height: 1.9;
      -webkit-font-smoothing: antialiased;
    }

    /* ナビゲーションバー */
    .top-nav {
      position: sticky; top: 0; background: rgba(255, 255, 255, 0.98); z-index: 1000;
      display: flex; justify-content: space-between; align-items: center;
      padding: 14px 24px; border-bottom: 1px solid #111111;
      backdrop-filter: blur(5px);
    }
    
    .brand-logo {
      font-size: 1.5rem; font-weight: 800; text-decoration: none; color: #000;
      letter-spacing: 0.18em; text-transform: uppercase;
      text-shadow: 0.5px 0 0 #000;
    }

    .nav-right { display: flex; align-items: center; gap: 20px; }
    
    .search-btn { background: none; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 4px; }
    .search-btn svg { width: 18px; height: 18px; stroke: #111; stroke-width: 2.2; fill: none; }

    .menu-btn { background: none; border: none; cursor: pointer; font-size: 1.65rem; color: #111; line-height: 1; padding: 2px; }

    /* 全画面メニュー */
    #overlay-menu {
      position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
      background-color: rgba(10, 10, 10, 0.96); color: #fff;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 10000; opacity: 0; visibility: hidden; transition: opacity 0.3s ease, visibility 0.3s ease;
    }
    #overlay-menu.active { opacity: 1; visibility: visible; }
    .close-btn { position: absolute; top: 24px; right: 28px; font-size: 2.2rem; color: #fff; background: none; border: none; cursor: pointer; }
    .menu-list { list-style: none; text-align: center; }
    .menu-list li { margin: 24px 0; }
    .menu-list a { color: #fff; text-decoration: none; font-size: 1.25rem; letter-spacing: 0.15em; }

    /* メインコンテンツ枠 */
    .container { max-width: 680px; margin: 0 auto; padding: 30px 24px 50px; }

    /* ページタイトル */
    .page-title {
      font-size: 1.4rem; font-weight: 700; letter-spacing: 0.08em;
      margin-bottom: 20px;
    }

    /* コントロールエリア（並び替え・絞り込み） */
    .control-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding-bottom: 12px; margin-bottom: 25px; border-bottom: 1px solid #111;
      font-size: 0.9rem;
    }
    .sort-controls { display: flex; align-items: center; gap: 8px; }
    .select-box {
      border: none; background: none; font-family: inherit; font-size: 0.9rem;
      font-weight: bold; cursor: pointer; outline: none;
    }
    .order-btn {
      background: none; border: 1px solid #ccc; border-radius: 3px;
      padding: 2px 6px; cursor: pointer; font-size: 0.8rem;
    }

    .filter-btn {
      background: none; border: none; font-family: inherit; font-size: 0.9rem;
      font-weight: bold; cursor: pointer; display: flex; align-items: center; gap: 4px;
    }

    /* カラー別下線 */
    .line-blue   { border-bottom: 2px solid #4ba3e3; padding-bottom: 2px; }
    .line-green  { border-bottom: 2px solid #3cb878; padding-bottom: 2px; }
    .line-red    { border-bottom: 2px solid #f06292; padding-bottom: 2px; }
    .line-yellow { border-bottom: 2px solid #f6d155; padding-bottom: 2px; }

    /* 作品リスト（手書きレイアウト再現） */
    .article-list { list-style: none; margin-bottom: 30px; }
    .article-item {
      padding: 16px 0; border-bottom: 1px dashed #e0e0e0; text-decoration: none;
      color: inherit; display: block;
    }
    .article-item:hover { opacity: 0.8; }
    .article-title-wrap { margin-bottom: 8px; }
    .article-title { font-weight: 700; font-size: 1.05rem; }
    
    .article-meta-row {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 0.82rem; color: #666;
    }

    /* ページネーション */
    .pagination {
      display: flex; justify-content: center; align-items: center; gap: 12px;
      margin: 35px 0 25px; font-size: 1rem;
    }
    .page-num {
      text-decoration: none; color: #111; padding: 2px 8px; cursor: pointer;
    }
    .page-num.active {
      border: 1px solid #111; font-weight: bold;
    }

    /* ページ検索 */
    .page-search-box {
      display: flex; justify-content: center; align-items: center; gap: 10px;
      margin-bottom: 40px; font-size: 0.88rem;
    }
    .page-input {
      width: 60px; padding: 4px 8px; text-align: center;
      border: 1px solid #ccc; font-family: inherit; font-size: 0.88rem;
    }
    .page-submit-btn {
      background: none; border: 1px solid #111; padding: 4px 10px;
      cursor: pointer; font-family: inherit; font-size: 0.85rem;
    }

    /* 絞り込みモーダル */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
      background: rgba(0,0,0,0.5); display: flex; justify-content: center; align-items: center;
      z-index: 10000; opacity: 0; visibility: hidden; transition: opacity 0.2s;
    }
    .modal-overlay.active { opacity: 1; visibility: visible; }
    .modal-content {
      background: #fff; width: 85%; max-width: 360px; padding: 25px; border-radius: 4px;
    }
    .modal-title { font-size: 1rem; font-weight: bold; margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 8px; }
    .color-filter-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .color-filter-item {
      padding: 10px 14px; cursor: pointer; font-size: 0.9rem; font-weight: 500;
      display: flex; justify-content: space-between; align-items: center;
    }

    /* フッター黒エリア */
    .footer-dark-section {
      background-color: #111111;
      color: #ffffff;
      width: 100%;
      padding: 50px 24px 40px;
      margin-top: 60px;
    }
    .footer-dark-inner {
      max-width: 680px;
      margin: 0 auto;
      text-align: center;
    }

    /* 連絡先エリア */
    .contact-info-box {
      margin-bottom: 30px;
      padding-bottom: 25px;
      border-bottom: 1px dashed #333333;
      font-size: 0.88rem;
      color: #cccccc;
      line-height: 2.2;
    }
    .contact-info-box a {
      color: #ffffff;
      text-decoration: underline;
    }

    /* フッターナビ */
    .footer-links { list-style: none; text-align: center; font-size: 0.88rem; line-height: 2.5; margin-bottom: 35px; }
    .footer-links a { color: #cccccc; text-decoration: none; transition: color 0.2s; }
    .footer-links a:hover { color: #ffffff; }
    
    .dark-copyright { text-align: center; font-size: 0.82rem; color: #777777; border-top: 1px solid #222222; padding-top: 25px; }
  </style>
</head>
<body>

  <!-- ナビゲーション -->
  <div class="top-nav">
    <a href="index.html" class="brand-logo">北風小僧</a>
    <div class="nav-right">
      <button class="search-btn" title="検索">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="16" y1="16" x2="21" y2="21"/></svg>
      </button>
      <button class="menu-btn" onclick="toggleMenu()">☰</button>
    </div>
  </div>

  <!-- メニュー -->
  <div id="overlay-menu">
    <button class="close-btn" onclick="toggleMenu()">✕</button>
    <ul class="menu-list">
      <li><a href="list.html">文章一覧</a></li>
      <li><a href="about.html">私について</a></li>
      <li><a href="contact.html">お問い合わせ</a></li>
      <li><a href="contact.html">感想を送る</a></li>
    </ul>
  </div>

  <div class="container">

    <h1 class="page-title">作品一覧</h1>

    <!-- コントロールバー -->
    <div class="control-bar">
      <div class="sort-controls">
        <select id="sort-select" class="select-box" onchange="changeSort()">
          <option value="date">新着順</option>
          <option value="popular">人気順</option>
        </select>
        <button id="order-toggle-btn" class="order-btn" onclick="toggleOrder()">↓ 降順</button>
      </div>

      <button class="filter-btn" onclick="openFilterModal()">
        絞り込み ⚙
      </button>
    </div>

    <!-- 作品一覧リスト -->
    <div class="article-list" id="article-list-container"></div>

    <!-- ページネーション -->
    <div class="pagination" id="pagination-container"></div>

    <!-- ページ検索 -->
    <div class="page-search-box">
      <span>ページ検索</span>
      <input type="number" id="page-input" class="page-input" min="1">
      <button class="page-submit-btn" onclick="jumpToPage()">移動</button>
    </div>

  </div>

  <!-- 絞り込みモーダル -->
  <div class="modal-overlay" id="filter-modal" onclick="closeFilterModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="modal-title">色によるジャンル絞り込み</div>
      <ul class="color-filter-list">
        <li class="color-filter-item" style="background:#f4f4f4;" onclick="applyColorFilter('all')">すべて表示</li>
        <li class="color-filter-item" style="background:#5baed7;" onclick="applyColorFilter('line-blue')">青色ジャンル（評論もどき）</li>
        <li class="color-filter-item" style="background:#52be80;" onclick="applyColorFilter('line-green')">緑色ジャンル（随筆）</li>
        <li class="color-filter-item" style="background:#f1789a;" onclick="applyColorFilter('line-red')">赤色ジャンル（小説）</li>
        <li class="color-filter-item" style="background:#f7d358;" onclick="applyColorFilter('line-yellow')">黄色ジャンル（詩歌）</li>
      </ul>
    </div>
  </div>

  <!-- フッター黒エリア -->
  <div class="footer-dark-section">
    <div class="footer-dark-inner">
      
      <div class="contact-info-box">
        <p>Gmail: <a href="mailto:xxx@gmail.com">xxx@gmail.com</a></p>
        <p>Twitter (X): <a href="https://twitter.com/xxx" target="_blank" rel="noopener">@xxx</a></p>
      </div>

      <ul class="footer-links">
        <li><a href="about.html">私について</a></li>
        <li><a href="terms.html">サイトのご利用について</a></li>
        <li><a href="help.html">ヘルプ</a></li>
        <li><a href="contact.html">お問い合わせ</a></li>
      </ul>

      <div class="dark-copyright">&copy; 北風小僧</div>
    </div>
  </div>

  <script>
    /* 全作品サンプルデータ */
    const allArticles = [
      { id: 1, title: "はじめに", url: "hajimene.html", date: "2026.04.29", length: "56,213文字", popularRank: 2, colorClass: "line-green" },
      { id: 2, title: "恐怖の構造", url: "article2.html", date: "2026.08.21", length: "14,296文字", popularRank: 1, colorClass: "line-blue" },
      { id: 3, title: "一般化の罠", url: "article3.html", date: "2026.08.14", length: "23,412文字", popularRank: 4, colorClass: "line-blue" },
      { id: 4, title: "作品論", url: "article4.html", date: "2026.07.29", length: "11,342文字", popularRank: 3, colorClass: "line-red" },
      { id: 5, title: "嫉妬", url: "article5.html", date: "2026.07.14", length: "21,432文字", popularRank: 5, colorClass: "line-yellow" },
      { id: 6, title: "忘却の地平", url: "#", date: "2026.06.30", length: "12,314文字", popularRank: 6, colorClass: "line-green" },
      { id: 7, title: "言葉の余白", url: "#", date: "2026.06.15", length: "8,900文字", popularRank: 7, colorClass: "line-green" },
      { id: 8, title: "夜の思考実験", url: "#", date: "2026.05.28", length: "19,200文字", popularRank: 8, colorClass: "line-blue" },
      { id: 9, title: "断章", url: "#", date: "2026.05.10", length: "4,500文字", popularRank: 9, colorClass: "line-yellow" },
      { id: 10, title: "夏至の日に", url: "#", date: "2026.04.30", length: "12,314文字", popularRank: 10, colorClass: "line-red" },
      { id: 11, title: "春の終わり", url: "#", date: "2026.04.15", length: "9,800文字", popularRank: 11, colorClass: "line-green" },
      { id: 12, title: "記憶の構造", url: "#", date: "2026.03.20", length: "15,600文字", popularRank: 12, colorClass: "line-blue" }
    ];

    let currentPage = 1;
    const itemsPerPage = 10;
    let currentSort = "date"; // 'date' or 'popular'
    let isDescending = true;  // true: 降順, false: 昇順
    let currentColorFilter = "all";

    /* リスト制御処理 */
    function getProcessedArticles() {
      let list = [...allArticles];

      /* 1. 色絞り込み */
      if (currentColorFilter !== "all") {
        list = list.filter(item => item.colorClass === currentColorFilter);
      }

      /* 2. 並び替え */
      list.sort((a, b) => {
        let valA, valB;
        if (currentSort === "date") {
          valA = new Date(a.date.replace(/\./g, '/'));
          valB = new Date(b.date.replace(/\./g, '/'));
        } else {
          valA = a.popularRank;
          valB = b.popularRank;
        }

        if (isDescending) {
          return currentSort === "date" ? valB - valA : valA - valB;
        } else {
          return currentSort === "date" ? valA - valB : valB - valA;
        }
      });

      return list;
    }

    /* 描画メイン関数 */
    function render() {
      const articles = getProcessedArticles();
      const totalPages = Math.ceil(articles.length / itemsPerPage) || 1;

      if (currentPage > totalPages) currentPage = totalPages;
      if (currentPage < 1) currentPage = 1;

      /* リスト部分の描画 */
      const container = document.getElementById('article-list-container');
      container.innerHTML = '';

      const start = (currentPage - 1) * itemsPerPage;
      const pageArticles = articles.slice(start, start + itemsPerPage);

      if (pageArticles.length === 0) {
        container.innerHTML = '<p style="text-align:center; padding: 40px 0; color:#888;">該当する作品がありません。</p>';
      } else {
        pageArticles.forEach(item => {
          container.innerHTML += `
            <a href="${item.url}" class="article-item">
              <div class="article-title-wrap">
                <span class="article-title"><span class="${item.colorClass}">${item.title}</span></span>
              </div>
              <div class="article-meta-row">
                <span>${item.date}</span>
                <span>${item.length}</span>
              </div>
            </a>
          `;
        });
      }

      /* ページネーション部分の描画 */
      const pagination = document.getElementById('pagination-container');
      pagination.innerHTML = '';

      for (let i = 1; i <= totalPages; i++) {
        pagination.innerHTML += `
          <span class="page-num ${i === currentPage ? 'active' : ''}" onclick="goToPage(${i})">${i}</span>
        `;
      }
      if (totalPages > 5) {
        pagination.innerHTML += `<span style="color:#888;">...</span>`;
      }
    }

    /* 並び替え変更 */
    function changeSort() {
      currentSort = document.getElementById('sort-select').value;
      currentPage = 1;
      render();
    }

    /* 昇順・降順切り替え */
    function toggleOrder() {
      isDescending = !isDescending;
      const btn = document.getElementById('order-toggle-btn');
      btn.innerText = isDescending ? "↓ 降順" : "↑ 昇順";
      currentPage = 1;
      render();
    }

    /* ページ移動 */
    function goToPage(page) {
      currentPage = page;
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    /* ページ検索入力移動 */
    function jumpToPage() {
      const input = document.getElementById('page-input').value;
      if (input) {
        goToPage(parseInt(input, 10));
      }
    }

    /* モーダル操作 */
    function openFilterModal() {
      document.getElementById('filter-modal').classList.add('active');
    }
    function closeFilterModal(e) {
      document.getElementById('filter-modal').classList.remove('active');
    }
    function applyColorFilter(color) {
      currentColorFilter = color;
      closeFilterModal();
      currentPage = 1;
      render();
    }

    /* メニュー開閉 */
    function toggleMenu() {
      document.getElementById('overlay-menu').classList.toggle('active');
    }

    /* 初期実行 */
    render();
  </script>
</body>
</html>
